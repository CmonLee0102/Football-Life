  save();
  endSeason();
}

/* ---- 比賽核心運算（即時 / 跳過 共用） ---- */
function rollMatch(forced){
  const opp = leagueOpponent(G.week-1);
  const oppStr = opp? opp.str + rand(-6,6) : TIER_STR[G.tier] + rand(-10,10);
  const myStr = G.overall + (G.form-60)/3 + (G.morale-50)/8 - (forced?8:0) - (G.fitness<40?6:0);
  // 球隊越強、你越弱 → 越難擠進先發（教練關係好也更容易先發）
  const coachBonus=((G.coachRel||60)-60)*0.5;
  const starter = G.overall >= TIER_STR[G.tier]-10 || chance(clamp(70-(TIER_STR[G.tier]-10-G.overall)*2.2 + coachBonus, 6, 88));
  // 非先發：多數情況以替補身分登場（年輕球員機會更多），少數完全沒上場
  let minutes = starter? rand(70,90) : (chance(G.age<=20?82:70)? rand(20,55): 0);
  const diff = myStr - oppStr + rand(-15,15);
  let myGoals, oppGoals;
  if(diff>12){ myGoals=rand(2,4); oppGoals=rand(0,1); }
  else if(diff>3){ myGoals=rand(1,3); oppGoals=rand(0,2); }
  else if(diff>-6){ myGoals=rand(0,2); oppGoals=rand(0,2); }
  else{ myGoals=rand(0,1); oppGoals=rand(1,3); }
  let pg=0,pa=0,rating=6.0,perfRoll=0,injuryData=null,yellow=false,red=false;
  if(minutes>0){
    const rm=roleMod();
    // (3) 紅黃牌：防守型位置牌更多
    if(chance(15 + rm.def*4)) yellow=true;
    if(chance(2.2 + rm.def*1.2)) red=true;
    if(red){ minutes=Math.min(minutes,rand(35,70)); if(chance(45)) oppGoals++; } // 被罰下：提早結束、球隊易失球
    perfRoll = (myStr + rand(-20,25) + (G.form-60)/2)/100;
    const goalChance = clamp(perfRoll*46*rm.atk,0,82);
    const assistChance = clamp(perfRoll*34*rm.ast,0,72);
    for(let i=0;i<myGoals;i++){ if(chance(goalChance*0.6)) pg++; }
    if(G.pos==="GK") pg=0;   // 守門員不進球（除非未來加入定位球主罰機制）
    if(G.pos!=="GK") for(let i=0;i<myGoals;i++){ if(chance(assistChance*0.5)) pa++; }
    pa=Math.min(pa,Math.max(0,myGoals-pg));
    rating = computeRating(pg,pa,myGoals,oppGoals,perfRoll,minutes);
    if(red) rating=clamp(rating-1.3,3.5,10);
    else if(yellow) rating=clamp(rating-0.2,3.5,10);
    const injRisk = (forced?12:4) + (G.fitness<40?6:0);
    if(chance(injRisk)) injuryData=rollInjuryData();
  }
  return {forced,opp,oppStr,myStr,starter,minutes,myGoals,oppGoals,pg,pa,perfRoll,rating,injuryData,yellow,red};
}

function commitMatch(o){
  if(G.pos==='GK'){ o.pg=0; }   // 守門員永遠不記進球（最終保險）
  const derby=isDerby(o.opp&&o.opp.n);
  const dMul=derby?2:1;
  G.fitness=clamp(G.fitness - Math.round(o.minutes/5) - rand(3,8),0,100);
  G.form=clamp(G.form + (o.rating>=7?rand(3,8): o.rating>=6?rand(-2,3): -rand(3,8)),0,100);
  const won=o.myGoals>o.oppGoals;
  G.morale=clamp(G.morale + (won?rand(2,6):o.myGoals===o.oppGoals?0:-rand(2,5))*dMul + (o.rating>=8?4:0),0,100);
  if(won) G.careerW=(G.careerW||0)+1;
  // 人際關係：表現/勝負影響教練、更衣室、球迷
  const good=o.rating>=7.2, bad=o.rating<6;
  G.coachRel=clamp((G.coachRel||60) + (good?rand(1,3):bad?-rand(1,3):0) + (won?1:0) + (o.red?-4:0), 0,100);
  G.chem=clamp((G.chem||60) + (won?1:0) + (o.pa>0?1:0) + (bad?-1:0), 0,100);
  G.fanRel=clamp((G.fanRel||50) + ((o.pg>0?o.pg*2:0) + (won?2:o.myGoals===o.oppGoals?0:-2) + (o.rating>=8?2:0))*dMul, 0,100);
  if(derby){ logEvent("🔥",`德比大戰！對陣 ${o.opp.n} ${won?'獲勝':o.myGoals===o.oppGoals?'言和':'落敗'}（評分 ${o.rating.toFixed(1)}）。`, won?"log-gold":"log-bad"); if(won){ G.fame=clamp(G.fame+rand(2,4),0,100); } }
  G.trainEnergy=Math.min(MAX_TRAIN_ENERGY,(G.trainEnergy||0)+TRAIN_PER_MATCH);   // 出賽累積訓練次數（休息不補）
  G.diceSets=(G.diceSets||0)+1;   // 出賽累積一次「訓練點數骰」，可到訓練頁自行擲骰加點
  G.seasonApps++; G.careerApps++;
  G.seasonGoals+=o.pg; G.careerGoals+=o.pg;
  G.seasonAssists+=o.pa; G.careerAssists+=o.pa;
  G.seasonRatingSum+=o.rating; G._careerRatingSum=(G._careerRatingSum||0)+o.rating;
  G.lastRating=o.rating;
  const motm = o.rating>=8.3;
  if(motm){ G.seasonMOTM++; G.careerMOTM=(G.careerMOTM||0)+1; }
  if(o.pg>0||motm){ G.fame=clamp(G.fame + o.pg*rand(1,2) + (motm?2:0),0,100); G.socialFollowers+= (o.pg*0.15+(motm?0.3:0)); }
  let injuredNow=null;
  if(o.injuryData){ injuredNow=applyInjuryData(o.injuryData); }
  // (3) 紅黃牌與停賽
  let suspMsg=null;
  if(o.yellow){ G.seasonYellow=(G.seasonYellow||0)+1; if(G.seasonYellow%5===0){ G.suspend=(G.suspend||0)+1; suspMsg="累積 5 張黃牌，下一場停賽"; } }
  if(o.red){ G.seasonRed=(G.seasonRed||0)+1; const s=rand(1,2); G.suspend=(G.suspend||0)+s; suspMsg=`吃到紅牌，停賽 ${s} 場`; G.morale=clamp(G.morale-6,0,100); }
  return {motm, injuredNow, won, suspMsg};
}

// 即時模擬（跳過用）
function simulateMatch(forced){
  G.week++;
  const o=rollMatch(forced);
  recordLeagueResult(o);
  if(o.minutes===0){ processDNP(o); return; }
  const meta=commitMatch(o);
  save();
  showMatchResult(o,meta);
}

// 靜默模擬（跳過整季用，不彈視窗）
function simulateMatchSilent(forced){
  G.week++;
  const o=rollMatch(forced);
  recordLeagueResult(o);
  if(o.minutes===0){
    G.form=clamp(G.form-rand(2,5),0,100);
    G.morale=clamp(G.morale-rand(3,7),0,100);
    G.fitness=clamp(G.fitness+8,0,100);
    return;
  }
  const meta=commitMatch(o);
  if(o.pg>0 || meta.motm || o.red){
    logEvent(o.red?"🟥":"⚽",`vs ${o.opp?o.opp.n:'對手'} ${o.myGoals}-${o.oppGoals}${o.pg?`，你進 ${o.pg} 球`:''}${o.pa?`、助攻 ${o.pa}`:''}${o.red?'（紅牌）':''}（評分 ${o.rating.toFixed(1)}）。`,o.red?"log-bad":"log-good");
  }
}

function computeRating(pg,pa,tf,ta,perfRoll,minutes){
  let r=6.0;
  if(G.pos==="GK"){
    r = ta===0? 7.5 : ta===1?6.8: ta<=2?6.2:5.4;
    r += (perfRoll-0.7)*2;
  } else {
    r = 5.8 + (perfRoll-0.6)*3;
    r += pg*1.1 + pa*0.7;
    if(G.pos==="DF"){ r += ta===0?0.9: ta>=3?-0.8:0; }
  }
  if(minutes<45) r=Math.min(r,7.5);
  return clamp(Math.round(r*10)/10,3.5,10);
}

function processDNP(o){
  const oppN=o.opp?o.opp.n:"對手";
  G.form=clamp(G.form-rand(2,5),0,100);
  G.morale=clamp(G.morale-rand(3,7),0,100);
  G.fitness=clamp(G.fitness+8,0,100);
  save();
  showEvent({emoji:"🪑",title:"未獲上場",text:`本輪你坐了整場替補席，${G.club.n} ${o.myGoals}-${o.oppGoals} ${oppN} 收場。教練沒給你機會，你有些沮喪。`,
    choices:[
      {i:"💪",t:"更努力訓練爭取機會",fn:()=>{G.morale=clamp(G.morale+5,0,100); afterWeekChecks();}},
      {i:"😤",t:"找教練談談",fn:()=>{if(chance(50)){G.morale=clamp(G.morale+10,0,100);toast("教練承諾給你機會");}else{G.morale=clamp(G.morale-5,0,100);toast("教練不為所動");} afterWeekChecks();}}
    ]});
}

// 停賽/未上場時，球隊仍照常出戰（更新積分榜）
function teamOnlyResult(){
  G.week++;
  const opp=leagueOpponent(G.week-1);
  const oppStr = opp? opp.str+rand(-6,6): TIER_STR[G.tier]+rand(-10,10);
  const diff=(G.overall-4)-oppStr+rand(-15,15);
  let mg,og; if(diff>10){mg=rand(1,3);og=rand(0,1);} else if(diff>-8){mg=rand(0,2);og=rand(0,2);} else {mg=rand(0,1);og=rand(1,3);}
  const o={opp, myGoals:mg, oppGoals:og};
  recordLeagueResult(o);
  return o;
}
function sitOutMatch(){
  closeModal();
  const o=teamOnlyResult();
  G.suspend=Math.max(0,(G.suspend||0)-1);
  G.fitness=clamp(G.fitness+10,0,100);
  logEvent("🚫",`停賽觀戰：${G.club.n} ${o.myGoals}-${o.oppGoals} ${o.opp?o.opp.n:'對手'}。`,"");
  if(G.week>=38){ save(); endSeason(); return; }
  afterWeekChecks();
}

function rollInjuryData(){
  const injuries=[
    {n:"腳踝扭傷",w:[1,3]},{n:"大腿拉傷",w:[2,4]},{n:"膝蓋挫傷",w:[2,5]},
    {n:"腳趾骨裂",w:[3,6]},{n:"肌肉疲勞",w:[1,2]},{n:"腦震盪",w:[1,3]},
  ];
  const inj=pick(injuries);
  return {name:inj.n, weeks:rand(inj.w[0],inj.w[1])};
}
function applyInjuryData(d){
  G.injury={name:d.name,weeks:d.weeks,lostAttr:{}};
  // 傷病造成能力衰退：小傷主要掉狀態與體能；大傷（4 週以上）傷及硬實力（可透過復健訓練找回）
  G.form=clamp(G.form-rand(8,16),0,100);
  G.fitness=clamp(G.fitness-rand(10,20),0,100);
  const heavy=d.weeks>=4;
  const rows=attrRowsForPos();
  const n=heavy?rand(2,3):(d.weeks>=2?1:0);
  let lost=[];
  for(let i=0;i<n;i++){
    const [k]=pick(rows);
    const dec=heavy?rand(1,3):1;
    const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]-dec,20,99);
    const real=b-G.attr[k];
    if(real>0){ G.injury.lostAttr[k]=(G.injury.lostAttr[k]||0)+real; lost.push(`${attrLabel(k)} -${real}`); }
  }
  if(lost.length) G.overall=calcOverall();
  const extra = lost.length? `，${heavy?'傷勢嚴重，':''}${lost.join("、")}` : '';
  logEvent("🩹",`比賽中受傷：${d.name}，需休養 ${d.weeks} 週${extra}。`,"log-bad");
  return G.injury;
}

let LM=null;
function liveSleep(ms){ const mul=(LM&&LM.speedMul)||1; return sleep(Math.max(0,Math.round(ms/mul))); }
function toggleLiveSpeed(){
  if(!LM) return;
  LM.speedMul = (!LM.speedMul||LM.speedMul===1) ? 2 : LM.speedMul===2 ? 4 : 1;
  const b=$("#liveSpeedBtn"); if(b) b.textContent=`⏩ ${LM.speedMul}x`;
}

async function startLiveMatch(forced){
  G.week++;
  const o=rollMatch(forced);
  recordLeagueResult(o);
  if(o.minutes===0){ processDNP(o); return; }
  LM={o, myScore:0, oppScore:0, minute:0};
  buildTimeline();
  renderLiveShell(o);
  await liveSleep(300);
  await playTimeline();
  // 決策可能改變進球數 → 重算評分
  o.rating = computeRating(o.pg,o.pa,o.myGoals,o.oppGoals,o.perfRoll,o.minutes);
  if(o.red) o.rating=clamp(o.rating-1.3,3.5,10); else if(o.yellow) o.rating=clamp(o.rating-0.2,3.5,10);
  const meta=commitMatch(o);
  save();
  showLiveSummary(o,meta);
}

function spreadMinutes(n){
  const arr=[]; for(let i=0;i<n;i++){ arr.push(rand(3,89)); } return arr;
}
function buildTimeline(){
  const o=LM.o;
  // 替補：非先發且上場時間不多 → 從板凳開始，中途換人上場
  const sub = !o.starter && o.minutes>0 && o.minutes<80;
  const onMin = sub? clamp(90-o.minutes, 25, 82) : 0;
  LM.subOn = onMin; LM.onPitch = !sub;
  const tl=[{min:0,type:'kick'}];
  if(sub) tl.push({min:onMin,type:'subon'});
  const pMin=()=> sub? rand(onMin+1,89) : rand(6,88);   // 我方參與事件需在場上時
  let pgLeft=o.pg, paLeft=o.pa;
  spreadMinutes(o.myGoals).forEach(m=>{
    if(pgLeft>0){ tl.push({min:pMin(),type:'goal_me',player:'scorer'}); pgLeft--; }
    else if(paLeft>0){ tl.push({min:pMin(),type:'goal_me',player:'assist'}); paLeft--; }
    else tl.push({min:m,type:'goal_me',player:'team'});   // 隊友進球可在任何時間（含你在板凳時）
  });
  spreadMinutes(o.oppGoals).forEach(m=> tl.push({min:m,type:'goal_opp'}));
  const flavorN= sub? rand(1,3) : rand(3,5);
  for(let i=0;i<flavorN;i++){ tl.push({min:pMin(),type:'chance'}); }
  if(o.yellow) tl.push({min: sub? rand(onMin+1,86):rand(15,80),type:'yellow'});
  if(o.red) tl.push({min: sub? rand(onMin+2,88):rand(35,85),type:'red'});
  if(o.injuryData){ tl.push({min: sub? rand(onMin+1,86):rand(25,86),type:'injury'}); }
  tl.push({min:45,type:'ht'});
  tl.push({min:90,type:'ft'});
  tl.sort((a,b)=> a.min-b.min);
  LM.timeline=tl;
}

function askLive(prompt, options){

async function tickClockTo(target){
  const clock=$("#clock");
  const speed=22;
  while(LM.minute<target){
    LM.minute++;
    if(clock) clock.textContent=LM.minute;
    if(LM.minute%9===0) moveBall(rand(20,80));
    await liveSleep(speed);
  }
}
async function playTimeline(){
  const tl=LM.timeline;
  for(let i=0;i<tl.length;i++){
    await tickClockTo(tl[i].min);
    await processMoment(tl[i]);
  }
}

async function processMoment(ev){
  const min=ev.min;
  if(ev.type==='kick'){ sndWhistle(); feedAdd('🟢','開球！比賽正式開始。'); if(LM.subOn>0){ feedAdd('🪑',`你今天沒有進入先發，先在替補席待命，準備隨時上場…`); } moveBall(50); await liveSleep(350); return; }
  if(ev.type==='subon'){ sndWhistle(); LM.onPitch=true; celebrate(true); feedAdd('🔄',`${min}' <b style="color:var(--gold);">換人！你替補上場！</b>把握每一分鐘證明自己！`,'goal'); G.morale=clamp(G.morale+3,0,100); await liveSleep(750); return; }
  if(ev.type==='ht'){ feedAdd('⏸️',`半場結束，比分 ${LM.myScore} - ${LM.oppScore}。`); moveBall(50); await liveSleep(600); return; }
  if(ev.type==='ft'){
    sndWhistle();
    const r=LM.myScore>LM.oppScore?'你的球隊拿下勝利 🎉':LM.myScore===LM.oppScore?'雙方握手言和 🤝':'球隊惜敗 😔';
    feedAdd('🔚',`終場哨響！${r}`); await liveSleep(500); return;
  }
  if(ev.type==='goal_opp'){
    moveBall(10); await liveSleep(280);
    bumpScore('A'); celebrate(false);
    feedAdd('⚽',`${min}' 對手破門，${G.club.n} 城門失守…`,'oppgoal');
    await liveSleep(650); moveBall(50); return;
  }
  if(ev.type==='injury'){
    moveBall(rand(30,70));
    feedAdd('🩹',`${min}' 你在一次拼搶後倒地不起，隊醫緊急入場…`,'oppgoal');
    await liveSleep(850); return;
  }
  if(ev.type==='yellow'){ feedAdd('🟨',`${min}' 你戰術犯規吃到一張黃牌。`); await liveSleep(600); return; }
  if(ev.type==='red'){ feedAdd('🟥',`${min}' <b style="color:var(--red);">你被紅牌罰下！</b>球隊只能少打一人…`,'oppgoal'); celebrate(false); await liveSleep(900); return; }
  if(ev.type==='chance'){ await flavorChance(min); return; }
  if(ev.type==='goal_me'){
    moveBall(86); await liveSleep(260);
    if(ev.player==='scorer'){
      const o=LM.o;
      const sh=G.attr.shooting||50, dr=G.attr.dribbling||50, comp=G.attr.passing||50;
      const rate={
        power: clamp(Math.round(60+(sh-60)*0.5),40,93),
        calm:  clamp(Math.round(74+(sh-60)*0.3+comp*0.12),58,97),
        skill: clamp(Math.round(50+(dr-60)*0.5+(sh-60)*0.2),35,90),
      };
      const opt=await askLive(`⚡ ${min}' 你在禁區內獲得一次絕佳機會！`,[
        {label:`💥 大力抽射　<span style="color:var(--gold)">成功率 ${rate.power}%</span> <span style="color:var(--red);font-size:11px;">高風險·高報酬</span>`,k:'power'},
        {label:`🎯 冷靜推射　<span style="color:var(--gold)">成功率 ${rate.calm}%</span> <span class="muted" style="font-size:11px;">穩健</span>`,k:'calm'},
        {label:`🌈 過人再射　<span style="color:var(--gold)">成功率 ${rate.skill}%</span> <span style="color:var(--accent);font-size:11px;">高人氣</span>`,k:'skill'}
      ]);
      if(chance(rate[opt.k])){
        bumpScore('H'); celebrate(true);
        const desc={power:'一記勢大力沉的抽射直掛死角，門將毫無反應！',calm:'你冷靜地推射遠角，皮球應聲入網！',skill:'一個華麗的過人晃倒門將，輕鬆推入空門！'}[opt.k];
        feedAdd('⚽',`${min}' <b style="color:var(--gold);">你進球了！</b>${desc}`,'goal');
        // 高風險高報酬：抽射/過人破門更精彩，帶來額外狀態、名氣與人氣；冷靜推射穩健但無額外收益
        if(opt.k==='power'){ G.form=clamp(G.form+5,0,100); G.fame=clamp(G.fame+rand(1,3),0,100); G.socialFollowers+=0.3; G.morale=clamp(G.morale+2,0,100); feedAdd('🔥','石破天驚的抽射！這球會進今日十佳球，聲勢大漲！','goal'); }
        else if(opt.k==='skill'){ G.form=clamp(G.form+4,0,100); G.fame=clamp(G.fame+1,0,100); G.socialFollowers+=0.5; feedAdd('📱','華麗過人破門在社群瘋傳，粉絲暴增！','goal'); }
        else { G.form=clamp(G.form+2,0,100); }
      } else {
        // 射失：這粒進球不算，進球數同步扣掉
        o.pg=Math.max(0,o.pg-1); o.myGoals=Math.max(0,o.myGoals-1);
        const miss={power:'抽射高出橫樑，錯失良機！',calm:'推射被門將神勇撲出！',skill:'過人時被後衛及時攔截…'}[opt.k];
        feedAdd('❌',`${min}' 你的射門${miss}`,'oppgoal'); celebrate(false);
        // 高風險選項落空的代價：士氣受挫（冷靜推射失手代價較小）
        if(opt.k==='power'||opt.k==='skill'){ G.morale=clamp(G.morale-4,0,100); }
      }
      await liveSleep(750);
    } else if(ev.player==='assist'){
      bumpScore('H'); celebrate(true);
      feedAdd('🅰️',`${min}' <b style="color:var(--gold);">你送出精妙助攻！</b>隊友輕鬆推射破門！`,'goal');
      await liveSleep(700);
    } else {
      bumpScore('H'); celebrate(true);
      feedAdd('⚽',`${min}' ${G.club.n} 隊友進球，球隊領先！`,'goal');
      await liveSleep(600);
    }
    moveBall(50); return;
  }
}

const _atr=(k)=>G.attr[k]||50;
const rateOf=(base,...ks)=>clamp(Math.round(base + ks.reduce((s,k)=>s+(_atr(k)-60),0)*0.42), 25, 92);
async function flavorChance(min){
  // ── 守門員專屬決策 ──
  if(G.pos==='GK'){

      }

        const opt=await askLive(`🧤 ${min}' 你摘下高球，如何發動進攻？`,[
          {label:`⚡ 手拋快發打反擊　<span style="color:var(--gold)">成功率 ${r}%</span>`,k:'fast'},
          {label:`🦶 大腳解圍求穩　<span style="color:var(--gold)">成功率 100%</span>`,k:'safe'}]);
        if(opt.k==='fast'){ if(chance(r)){ feedAdd('👏',`${min}' 精準手拋策動閃電反擊，球隊獲良機！`); G.form=clamp(G.form+2,0,100);} else feedAdd('❌',`${min}' 快發被對方中場攔截，稍顯冒險。`);}
        else feedAdd('✅',`${min}' 大腳解圍，穩妥化解壓力。`);
        await liveSleep(500); return;
      }
      if(scen==='cross'){
        const r=rateOf(48,'handling','diving');
        const opt=await askLive(`🧤 ${min}' 對方開出一記威脅傳中！`,[
          {label:`🙌 果斷出擊摘球　<span style="color:var(--gold)">成功率 ${r}%</span>`,k:'catch'},

        const win=opt.k==='catch'?r:clamp(r+10,25,95);
        if(chance(win)) feedAdd('🧤',`${min}' 你${opt.k==='catch'?'穩穩摘下傳中':'果斷擊出解圍'}，指揮後防！`);
        else feedAdd('😨',`${min}' 出擊失誤，禁區一陣混亂…`,'oppgoal');

      }
      // penalty faced

/* ---- 訓練骰分配：出賽每場累積一次；擲三顆骰（各1~6），由左到右點能力分配，☆焦點+1 ---- */
function rollTrainingDice(){
  if((G.diceSets||0)<=0){ toast("目前沒有可用的骰子，出賽比賽即可獲得（每場 +1）"); return; }
  G._dice=[rand(1,6),rand(1,6),rand(1,6)];   // 擲三顆骰
  G._dpos=0;
  G._dbase=Object.assign({},G.attr);          // 快照，供「重新分配」還原
  const rows=attrRowsForPos();
  const sh=shuffle(rows.map(r=>r[0]));
  G._dfocus=[sh[0],sh[1]];                     // 本次訓練焦點（+1）
  showDiceAlloc();
}
function diceAttrPot(k){
  let h=0; const s=String(k); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  const off=(h%13)-6;                          // -6~+6，讓各能力潛力有差異
  return clamp(Math.round((G.potential||75)+off), (G.attr[k]||20), 99);
}
function showDiceAlloc(){
  const dice=G._dice||[]; const pos=G._dpos||0;
  const rows=attrRowsForPos(); const cur=dice[pos];
  const diceRow=dice.map((v,i)=>{
    const done=i<pos, active=i===pos;
    return `<div style="display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; margin:5px; border-radius:14px; font-size:22px; font-weight:800;
      ${active?'background:#12131a; color:var(--gold); box-shadow:0 0 12px rgba(245,196,81,.55); border:2px solid var(--gold);':done?'background:var(--panel2); color:var(--dim); opacity:.4; border:1px solid var(--line);':'background:var(--panel2); color:#cfcfe0; border:1px solid var(--line);'}">${v}</div>`;
  }).join('');
  const cards=rows.map(([k,label])=>{
    const fb=(G._dfocus||[]).includes(k)?1:0;
    const pot=diceAttrPot(k);
    const nv=clamp(G.attr[k]+cur+fb,20,pot);
    return `<button class="choice" style="display:block; text-align:left; padding:11px 13px;" onclick="assignDie('${k}')">
      <div style="font-weight:800;">${label} ${fb?'<span style="color:var(--gold);">☆+1</span>':''}</div>
      <div class="muted" style="font-size:12px; margin-top:3px;">${G.attr[k]} <span style="opacity:.55;">/ 潛力 ${pot}</span> → <b style="color:var(--gold);">${nv}</b></div>
    </button>`;
  }).join('');
  const resetBtn = pos>=1 ? `<button class="choice" onclick="resetDice()"><span class="ci">↩️</span>重新分配</button>` : '';
  showModalCustom(`
    <div class="emoji">🎲</div>
    <h3>訓練骰分配</h3>
    <p class="muted" style="font-size:13px; line-height:1.6; text-align:left;">由左到右分配：點選能力，把<b style="color:var(--gold);">發亮的骰子</b>加進去。☆ 為本次訓練焦點（+1）。第三顆指定後直接生效；按錯請在前兩顆時重新分配。</p>
    <div class="center" style="margin:8px 0 12px;">${diceRow}</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">${cards}</div>
    ${resetBtn}
  `);
}
function assignDie(k){
  const dice=G._dice||[]; const pos=G._dpos||0;
  if(pos>=dice.length) return;
  const fb=(G._dfocus||[]).includes(k)?1:0;
  const pot=diceAttrPot(k);
  G.attr[k]=clamp(G.attr[k]+dice[pos]+fb,20,pot);
  G.overall=calcOverall();
  G._dpos=pos+1;
  if(G._dpos>=3) finishDice();       // 第三顆指定後直接生效
  else showDiceAlloc();
}
function resetDice(){
  if(G._dbase) G.attr=Object.assign({},G._dbase);
  G.overall=calcOverall();
  G._dpos=0;
  showDiceAlloc();
}
function finishDice(){
  G.diceSets=Math.max(0,(G.diceSets||0)-1);   // 消耗一次擲骰
  G._dice=null; G._dpos=0; G._dbase=null; G._dfocus=null;
  save(); closeModal(); render();
}
function autoSpendDice(){
  // 跳過整季時，累積的訓練骰自動分配（三顆各加到當下最弱能力），玩家不必手動擲
  const n=G.diceSets||0; if(n<=0) return;
  const rows=attrRowsForPos(); let msg=[];
  for(let s=0;s<n;s++){
    for(let d=0; d<3; d++){
      const v=rand(1,6);
      let lowest=rows[0][0];
      rows.forEach(([k])=>{ if((G.attr[k]||0)<(G.attr[lowest]||0)) lowest=k; });
      const pot=diceAttrPot(lowest);
      const b=G.attr[lowest]; G.attr[lowest]=clamp(G.attr[lowest]+v,20,pot);
      if(G.attr[lowest]>b) msg.push(attrLabel(lowest));
    }
  }
  G.diceSets=0; G.overall=calcOverall();
  if(msg.length) logEvent("🎲",`跳過賽季累積的訓練骰已自動分配，${[...new Set(msg)].slice(0,5).join("、")} 等能力成長。`,"log-good");
}

  } else {

    save(); render();

}

// ── 傷病復健：每週三選一，各有取捨 ──
function regainLostAttrs(frac){
  const L=G.injury&&G.injury.lostAttr; if(!L) return [];
  let msg=[];
  Object.keys(L).forEach(k=>{
    if(L[k]<=0) return;
    const back=Math.min(L[k], Math.max(1,Math.round(L[k]*frac)));
    G.attr[k]=clamp((G.attr[k]||0)+back,20,99);
    L[k]-=back;
    if(back>0) msg.push(attrLabel(k));
  });
  G.overall=calcOverall();
  return [...new Set(msg)];
}
function afterRehab(){
  if(G.injury && G.injury.weeks<=0){
    const left=regainLostAttrs(0.5);   // 自然康復只找回剩餘流失的一半；其餘要靠復健訓練或日後練回
    logEvent("💚",`傷癒復出，重返賽場！${left.length?`（${left.join("、")} 部分恢復）`:''}`,"log-good");
    G.injury=null; toast("傷癒歸來！");
  }
  if(G.week>=38){ save(); endSeason(); return; }
  save(); render();
}
function rehabRest(){
  if(!G.injury) return;
  G.week++;
  G.injury.weeks=Math.max(0,G.injury.weeks-1);
  G.fitness=clamp(G.fitness+20,0,100);
  G.morale=clamp(G.morale-1,0,100);
  if(G.injury.weeks>0) toast(`靜養中…還需 ${G.injury.weeks} 週`);
  afterRehab();
}
function rehabDoctor(){
  if(!G.injury) return;
  const cost=Math.max(80,Math.round(marketValue()*0.02));
  if(G.money<cost){ toast(`看專科醫生需要 ${moneyStr(cost)}，資金不足`); return; }
  G.money-=cost;
  G.week++;
  const fast=chance(75);
  G.injury.weeks=Math.max(0,G.injury.weeks-(fast?2:1));
  G.fitness=clamp(G.fitness+12,0,100);
  logEvent("🏥",`看專科醫生（${moneyStr(cost)}）：${fast?'療效顯著，恢復加快':'恢復如常'}。`,fast?"log-good":"");
  if(G.injury.weeks>0) toast(fast?"療效顯著！傷勢 -2 週":"恢復如常，傷勢 -1 週");
  afterRehab();
}
function rehabTrain(){
  if(!G.injury) return;
  G.week++;
  if(chance(30)){   // 操之過急 → 傷勢惡化
    G.injury.weeks+=1;
    G.morale=clamp(G.morale-6,0,100);
    G.fitness=clamp(G.fitness+5,0,100);
    logEvent("🩹","復健操之過急，傷勢反覆，恢復期延長。","log-bad");
    toast(`傷勢惡化…恢復期 +1 週（還需 ${G.injury.weeks} 週）`);
    afterRehab();
    return;
  }
  G.injury.weeks=Math.max(0,G.injury.weeks-1);
  G.fitness=clamp(G.fitness+10,0,100);
  const regained=regainLostAttrs(0.5);   // 找回一半的流失能力
  if(G.injury.weeks>0) toast(regained.length?`復健有成：${regained.join("、")} 回升`:"復健訓練完成");
  afterRehab();
}
function restWeek(){
  if(!G.injury) return;
  rehabRest();
}

/* ============================================================
   SEASON END
   ============================================================ */
function endSeason(){
  // Sponsor payouts
  let sponsorIncome=0;
  G.sponsors.forEach(s=>sponsorIncome+=s.pay);
  // Wage income (approx 38 weeks already conceptually; give a season bonus)
  const wageIncome = G.wage*38;
  G.money += wageIncome + sponsorIncome;

  const avg = G.seasonApps? G.seasonRatingSum/G.seasonApps : 0;
  // Trophies / awards
  const trophies=[];
  const seasonLabel=`第${G.season}季`;
  // (1) 聯賽冠軍由積分榜名次決定
  ensureLeague();
  const rank = G.lg? myRank() : 0;
  if(rank===1){ trophies.push("🏆 聯賽冠軍"); }
  // top scorer（金靴）：本季進球數高且在聯賽名列前茅
  if(G.seasonGoals>=18 && (G.pos==="FW"||G.pos==="MF")){ trophies.push(`👟 金靴獎 (${G.seasonGoals}球)`); }
  if(G.seasonApps>0 && avg>=7.8){ trophies.push("⭐ 賽季最佳陣容"); }
  if(G.pos==="GK" && avg>=7.5){ trophies.push("🧤 金手套獎"); }
  // Player of the season
  let potm=false;
  if(avg>=8 && G.seasonApps>=20){ trophies.push("🥇 賽季最佳球員"); potm=true; }

  trophies.forEach(t=>G.trophies.push({season:seasonLabel,name:t}));

  // National team call-up
  let natNews="";
  if(!G.natTeam && G.overall>=72 && G.fame>=35 && avg>=6.8){
    G.natTeam=true;
    natNews=`📣 你首次入選 ${G.nation.n} 國家隊！`;
    logEvent("🌍",`首次入選 ${G.nation.n} 國家隊！`,"log-gold");
  }
  if(G.natTeam){
    const caps=rand(4,10); G.caps+=caps;
    const ig = G.pos==="FW"? rand(0,6): G.pos==="MF"?rand(0,3):rand(0,1);
    G.intlGoals+=ig;
    if(!natNews) natNews=`🌍 本季代表 ${G.nation.n} 出賽 ${caps} 場，攻入 ${ig} 球。`;
  }

  // (6) 國際大賽（每兩季一屆，世界盃 / 洲際盃 輪替）
  let tourNews="";
  if(G.natTeam && G.season%2===0){
    const isWC=Math.floor(G.season/2)%2===0;
    // 依國家所屬洲別決定洲際盃（避免紐西蘭之類拿到歐國盃）
    const CONT_CUP={eu:"歐國盃", sa:"美洲盃", na:"中北美金盃", af:"非洲國家盃", as:"亞洲盃", oc:"大洋洲國家盃"};
    const tname = isWC? "世界盃" : (CONT_CUP[(G.nation&&G.nation.reg)] || "洲際盃");
    const stages=["16強","8強","4強","決賽"];
    let tg = G.pos==="FW"?rand(0,3):G.pos==="MF"?rand(0,2):rand(0,1);
    let tc = rand(3,4), champ=false, result="小組賽出局";
    if(chance(clamp(46+(G.overall-70)*2,20,90))){          // 小組出線
      result="16強止步"; let alive=true;
      for(let i=0;i<stages.length && alive;i++){
        tc++; if(G.pos!=="GK"&&chance(38)) tg+=rand(0,1);
        const winP=clamp(52+(G.overall-74)*2 - i*3, 18, 82);
        if(chance(winP)){ if(stages[i]==="決賽"){ champ=true; result="冠軍"; } }
        else { result={"16強":"16強止步","8強":"八強止步","4強":"四強止步","決賽":"屈居亞軍"}[stages[i]]; alive=false; }
      }
    }
    G.caps+=tc; G.intlGoals+=tg;
    if(champ){ G.trophies.push({season:seasonLabel,name:`🌍 ${tname}冠軍`}); logEvent("🌍",`率領 ${G.nation.n} 奪得 ${tname}冠軍！`,"log-gold"); tourNews=`🏆 你率領 ${G.nation.n} 勇奪 ${tname}冠軍！本屆攻進 ${tg} 球。`; }
    else tourNews=`🌍 ${G.nation.n} 在${tname}${result}，你本屆攻進 ${tg} 球。`;
    G.fame=clamp(G.fame+(champ?rand(6,10):rand(1,3)),0,100);
  }

  // ── (7) 球會盃賽：國內盃 + 洲際盃（歐冠/解放者盃/亞冠）+ 世俱盃 ──
  const clubCups=[];
  const tierStr=TIER_STR[G.tier]||70;
  const knockout=(stages,base,step,goalP)=>{ // 回傳 {champ,result,goals}
    let alive=true,champ=false,result=stages[0]+"出局",g=0;
    for(let i=0;i<stages.length&&alive;i++){
      if(G.pos!=="GK"&&chance(goalP)) g+=rand(0,1);
      if(chance(base - i*step)){ if(i===stages.length-1){champ=true;result="冠軍";} }
      else { result=stages[i]+(i===0?"出局":"止步"); alive=false; }
    }
    return {champ,result,goals:g};
  };
  if(G.seasonApps>0){
    // 國內盃（每季都有）
    const DCUP={"英超":"足總盃","西甲":"國王盃","德甲":"德國盃","義甲":"義大利盃","法甲":"法國盃","葡超":"葡萄牙盃","荷甲":"荷蘭盃","蘇超":"蘇格蘭盃","巴甲":"巴西盃","阿甲":"阿根廷盃","J聯賽":"天皇盃","K聯賽":"韓國足協盃","台灣企甲":"台灣足協盃"};
    const dcup=DCUP[G.league];
    if(dcup){
      const r=knockout(["32強","16強","8強","4強","決賽"], clamp(40+(G.overall-tierStr)*2,15,72), 4, 30);
      if(r.champ){ G.trophies.push({season:seasonLabel,name:`🏆 ${dcup}冠軍`}); logEvent("🏆",`奪得 ${dcup}冠軍！`,"log-gold"); G.fame=clamp(G.fame+rand(2,5),0,100); }
      clubCups.push({name:dcup, ...r, tier:'dom'});
    }
    // 洲際盃（需聯賽前段：名次≤6 或 強隊以上才有資格）
    const EU=["英超","西甲","德甲","義甲","法甲","葡超","荷甲","蘇超"];
    const ccName = EU.includes(G.league)?"歐洲冠軍聯賽" : (G.league==="巴甲"||G.league==="阿甲")?"解放者盃" : (G.league==="J聯賽"||G.league==="K聯賽"||G.league==="台灣企甲")?"亞冠聯賽" : null;
    const ccQual = ccName && ((rank && rank<=6) || G.tier==="strong" || G.tier==="elite");
    if(ccQual){
      const r=knockout(["小組賽","16強","8強","4強","決賽"], clamp(42+(G.overall-tierStr)*2,16,74), 5, 32);
      if(r.champ){ G.trophies.push({season:seasonLabel,name:`🌟 ${ccName}冠軍`}); logEvent("🌟",`歷史性奪得 ${ccName}冠軍！`,"log-gold"); G.fame=clamp(G.fame+rand(6,12),0,100); G._ccWinNext=true; }
      clubCups.push({name:ccName, ...r, tier:'cont'});
    }
    // 世俱盃（上季洲際冠軍才有資格）
    if(G.clubWorldCupQual){
      const r=knockout(["首圈","半準決賽","4強","決賽"], clamp(40+(G.overall-80)*2,18,66), 4, 30);
      if(r.champ){ G.trophies.push({season:seasonLabel,name:`🌐 世俱盃冠軍`}); logEvent("🌐",`站上世界之巔，奪得世界冠軍球會盃！`,"log-gold"); G.fame=clamp(G.fame+rand(8,15),0,100); }
      clubCups.push({name:"世俱盃", ...r, tier:'world'});
      G.clubWorldCupQual=false;
    }
  }
  // 聯賽冠軍 或 洲際盃冠軍 → 明年獲世俱盃資格（大幅提高出現機會）
  if(rank===1 || G._ccWinNext){ G.clubWorldCupQual=true; }
  G._ccWinNext=false;

  // fame growth from season
  G.fame=clamp(G.fame + (avg>=7?rand(2,6):0) + trophies.length*3,0,100);
  G.socialFollowers += G.socialFollowers*(avg>=7?0.15:0.05) + trophies.length*0.5;

  // Show season summary
  const summary = {
    apps:G.seasonApps, goals:G.seasonGoals, assists:G.seasonAssists,
    avg:avg.toFixed(2), motm:G.seasonMOTM, income:wageIncome+sponsorIncome, trophies, natNews, potm,
    rank, teams:G.lg?G.lg.teams.length:0, tourNews, clubCups
  };
  // 記錄本季到生涯歷史（供評分趨勢折線圖）
  if(!G.seasonHistory) G.seasonHistory=[];
  G.seasonHistory.push({
    season:G.season, age:G.age,
    avg: G.seasonApps? Math.round(avg*100)/100 : 0,
    goals:G.seasonGoals, assists:G.seasonAssists, apps:G.seasonApps
  });
  logEvent("📅",`第${G.season}季結束：${G.seasonApps}場 ${G.seasonGoals}球 ${G.seasonAssists}助，平均評分 ${avg.toFixed(2)}。`,"log-good");
  checkMilestones();
  save();
  showSeasonSummary(summary);
}

function advanceSeason(){
  closeModal();
  // (7) 外借期滿返回母隊
  if(G.onLoan && G.parent){
    const from=G.club.n;
    G.club=G.parent.club; G.tier=G.parent.tier; G.league=G.club.l; G.wage=G.parent.wage; G.contractYears=G.parent.contractYears;
    G.onLoan=false; G.parent=null;
    logEvent("📥",`外借期滿，離開 ${from} 返回母隊 ${G.club.n}。`,"log-good");
  }
  // Age up
  // 擷取剛結束賽季的表現（重置前），用來決定能力升降
  const _perfAvg = G.seasonApps? G.seasonRatingSum/G.seasonApps : 0;
  const _perfApps = G.seasonApps, _perfMotm = G.seasonMOTM;
  G.age++;
  G.season++;
  G.week=0;
  // reset season stats
  G.seasonGoals=0; G.seasonAssists=0; G.seasonApps=0; G.seasonRatingSum=0; G.seasonMOTM=0;
  G.seasonYellow=0; G.seasonRed=0; G.suspend=0;
  G.contractYears--;
  G.fitness=100; G.form=60;
  G.trainEnergy=MAX_TRAIN_ENERGY;   // 季前給予訓練次數

  // Offseason growth / decline（依年齡曲線 + 本季表現）
  offseasonDevelopment(_perfAvg, _perfApps, _perfMotm);

  // Contract expiry
  if(G.contractYears<=0){
    handleContractExpiry();
    return;
  }
  // Retirement check
  if(checkRetirement()) return;

  // 新賽季重建聯賽積分榜與陣容
  buildLeague(); genSquad();
  G.morale=clamp(G.morale+5,0,100);
  save();
  render();
}

function offseasonDevelopment(perfAvg, perfApps, perfMotm){
  // 本季表現評級（出賽太少視為中性偏低）：好表現→成長更快/衰退更慢；差表現→退步
  const perf = (perfApps>=5)? perfAvg : 6.2;
  const great=perf>=7.4, good=perf>=6.9, poor=(perfApps>=5 && perf<6.2), bad=(perfApps>=5 && perf<5.7);
  const perfBoost = great?18: good?8: bad?-24: poor?-13: 0; // 影響成長/衰退機率
  const ovrBefore=G.overall;
  const gap=G.potential-G.overall;
  const rows=attrRowsForPos();
  let grew=[], declined=[];
  if(G.age<=25 && gap>0){
    // 成長期：越年輕越快，並依表現加減
    const base = G.age<=19?72 : G.age<=22?55 : 38;
    const rate = clamp(base+perfBoost, 8, 92);
    rows.forEach(([k])=>{ if(chance(rate)){ const g=rand(1, (G.age<=19||great)?3:2); const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+g,20,99); if(G.attr[k]>b) grew.push(attrLabel(k)); } });
  } else if(G.age>=30){
    // 衰退期：表現好可延緩衰退
    const declineChance = clamp((G.age>=35?80 : G.age>=33?60 : G.age>=31?40 : 26) - perfBoost, 10, 92);
    (G.pos==='GK'? ["speed","reflexes","diving"] : ["pace","physical","dribbling"]).forEach(k=>{
      if(G.attr[k]!==undefined && chance(declineChance)){ const d=rand(1, G.age>=34?3:2); G.attr[k]=clamp(G.attr[k]-d,20,99); declined.push(attrLabel(k)); }
    });
    // 老將經驗：技術類可能微升（表現好機率更高）
    if(G.age<=34 && chance(38+(great?20:good?10:0))){ const m=pick(G.pos==='GK'?["positioning","handling","kicking"]:["passing","defending"]); if(G.attr[m]!==undefined){ const b=G.attr[m]; G.attr[m]=clamp(G.attr[m]+1,20,99); if(G.attr[m]>b) grew.push(attrLabel(m)); } }
  } else {
    // 巔峰期(26–29)：表現主導升降
    if(great){ rows.slice(0,4).forEach(([k])=>{ if(chance(48)){ const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+1,20,99); if(G.attr[k]>b) grew.push(attrLabel(k)); } }); }
    else if(good && gap>0){ rows.forEach(([k])=>{ if(chance(24)){ const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+1,20,99); if(G.attr[k]>b) grew.push(attrLabel(k)); } }); }
  }
  // 表現不佳 → 不分年齡的「失準退步」
  if(poor||bad){ const pool=rows.map(r=>r[0]); for(let i=0;i<(bad?2:1);i++){ const k=pick(pool); if(G.attr[k]!==undefined && chance(bad?70:52)){ const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]-rand(1,2),20,99); if(G.attr[k]<b) declined.push(attrLabel(k)); } } }
  // 潛力調整：年輕又打出神級賽季 → 潛力上調
  if((great||(perfMotm||0)>=5) && G.age<=23 && G.potential<97){ G.potential=clamp(G.potential+rand(1,3),0,99); }
  G.overall=calcOverall();
  const d=G.overall-ovrBefore;
  if(grew.length) logEvent("📈",`（${G.age}歲）能力成長：${grew.slice(0,3).join("、")}。`,"log-good");
  if(declined.length) logEvent("📉",`（${G.age}歲）狀態下滑：${declined.slice(0,3).join("、")}。`,"log-bad");
  if(d!==0) logEvent(d>0?"⬆️":"⬇️",`賽季${perf>=6.9?'表現亮眼':perf<6.2&&perfApps>=5?'表現低迷':'結束'}，OVR ${ovrBefore} → ${G.overall}（${d>0?'+':''}${d}）。`, d>0?"log-gold":d<0?"log-bad":"");
}

function handleContractExpiry(){
  const offers=generateOffers();
  // ensure at least renewal option
  save();
  render();
  setTimeout(()=>{
    showModalCustom(`
      <div class="emoji">📝</div>
      <h3>合約到期！</h3>
      <p>你與 ${G.club.n} 的合約已到期。何去何從？</p>
      <button class="choice" onclick="renewContract()"><span class="ci">🔁</span>與 ${G.club.n} 續約<span class="cost">週薪 ${moneyStr(Math.round(G.wage*rand(105,130)/100))}</span></button>
      ${offers.map((o,i)=>`<button class="choice" onclick="acceptExpiryOffer(${i})">
        <span class="ci">${clubBadge(o.club,28)}</span><div style="flex:1;"><div style="font-weight:800;">${o.club.n}</div><div class="muted" style="font-size:11px;">${TIER_LABEL[o.tier]} · 週薪 ${moneyStr(o.wage)} · 簽約金 ${moneyStr(o.fee)}</div></div></button>`).join("")}
    `);
    window._expiryOffers=offers;
  },300);
}
function renewContract(){
  closeModal();
  G.wage=Math.round(G.wage*rand(105,130)/100);
  G.contractYears=rand(2,4);
  logEvent("🔁",`與 ${G.club.n} 續約，週薪 ${moneyStr(G.wage)}。`,"log-gold");
  toast("續約成功！");
  if(checkRetirement()) return;
  proceedToSeason();
}
function acceptExpiryOffer(i){
  const o=window._expiryOffers[i];
  closeModal();
  G.money+=o.fee;
  const old=G.club.n;
  signClub(o.club,o.tier);
  logEvent("🔄",`自由轉會加盟 ${o.club.n}（離開 ${old}），簽約金 ${moneyStr(o.fee)}。`,"log-gold");
  toast(`加盟 ${o.club.n}！`);
  if(checkRetirement()) return;
  proceedToSeason();
}
function proceedToSeason(){
  buildLeague(); genSquad();
  save(); render();
}

/* ============================================================
   RETIREMENT
   ============================================================ */
function checkRetirement(){
  // forced retire at high age with decline, or voluntary prompt
  if(G.age>=38){ triggerRetirement("年事已高，是時候掛靴了。"); return true; }
  if(G.age>=34 && G.overall<62 && chance(40)){
    // offer choice
    save(); render();
    setTimeout(()=>{
      showEvent({emoji:"🤔",title:"退役抉擇",text:`你已經 ${G.age} 歲，狀態下滑（OVR ${G.overall}）。要繼續踢球，還是光榮退役？`,
        choices:[
          {i:"⚽",t:"再戰一季",fn:()=>{proceedToSeason();}},

// 榮譽聚合：只列出「贏過的獎項種類」與次數，不逐季列出
function summarizeTrophies(){
  const rules=[
    ["聯賽冠軍","🏆 聯賽冠軍"],["金靴","👟 金靴獎"],["最佳陣容","⭐ 賽季最佳陣容"],
    ["金手套","🧤 金手套獎"],["最佳球員","🥇 賽季最佳球員"],
  ];
  const map={}, order=[];
  (G.trophies||[]).forEach(t=>{
    let key=null;
    for(const [kw,label] of rules){ if(t.name.includes(kw)){ key=label; break; } }
    if(!key) key=t.name.replace(/\s*\(.*?\)\s*/g,"");
    if(!(key in map)){ map[key]=0; order.push(key); }
    map[key]++;
  });
  return order.map(k=>({name:k,count:map[k]}));
}

// 生涯評分趨勢折線圖（SVG）
function ratingChart(history){
  const W=460,H=150, pad={l:26,r:10,t:12,b:22};
  if(!history || history.length===0){
    return '<div class="muted center" style="padding:24px 0;">尚無完整賽季資料</div>';
  }
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=history.length;
  const minR=4, maxR=10;
  const xFor=i=> n===1? pad.l+iw/2 : pad.l+(i/(n-1))*iw;
  const yFor=v=> pad.t+(1-(clamp(v,minR,maxR)-minR)/(maxR-minR))*ih;
  let grid="";
  [5,6,7,8,9].forEach(g=>{ const y=yFor(g);
    grid+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#2a2a34" stroke-width="1"/>`+
          `<text x="4" y="${(y+3).toFixed(1)}" fill="#8b8b98" font-size="9">${g}</text>`;
  });
  const pts=history.map((d,i)=>`${xFor(i).toFixed(1)},${yFor(d.avg).toFixed(1)}`).join(" ");
  const area=`${pad.l},${(pad.t+ih).toFixed(1)} ${pts} ${xFor(n-1).toFixed(1)},${(pad.t+ih).toFixed(1)}`;
  const dots=history.map((d,i)=>{
    const col=d.avg>=8?"#ffd257":d.avg>=7?"#f5c451":d.avg>=6?"#f3f3f6":"#f2557a";
    return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(d.avg).toFixed(1)}" r="2.6" fill="${col}"/>`;
  }).join("");
  let xlab="";
  const step=Math.max(1,Math.ceil(n/6));
  history.forEach((d,i)=>{ if(n<=8||i%step===0||i===n-1){
    xlab+=`<text x="${xFor(i).toFixed(1)}" y="${H-5}" fill="#8b8b98" font-size="9" text-anchor="middle">S${d.season}</text>`;
  }});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; height:auto;" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="rgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c451" stop-opacity=".4"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#rgrad)"/>
    <polyline points="${pts}" fill="none" stroke="#f5c451" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xlab}
  </svg>`;
}

function mostSimilarPlayer(){
  const keys = G.pos==="GK"? ["diving","handling","kicking","positioning","reflexes","speed"]
             : ["pace","shooting","passing","dribbling","defending","physical"];
  let best=null,bestScore=-999;
  LEGENDS.forEach(L=>{
    let sum=0,cnt=0;
    keys.forEach(k=>{ if(L.p[k]!=null && G.attr[k]!=null){ sum+=Math.abs(L.p[k]-G.attr[k]); cnt++; } });
    const avgDiff = cnt? sum/cnt : 60;
    let score = 100 - avgDiff*1.15 - (L.pos===G.pos?0:35); // 位置不同大幅扣分
    if(score>bestScore){ bestScore=score; best=L; }
  });
  return {player:best, pct:clamp(Math.round(bestScore),41,99)};
}

  {id:"wed", ic:"💍",n:"步入婚姻",d:"結婚成家",cond:()=>G.married},
  {id:"kid", ic:"👶",n:"為人父母",d:"迎接第一個孩子",cond:()=>G.kids>=1},
  {id:"lux_car",ic:"🚗",n:"超跑入庫",d:"購入一台超級跑車",cond:()=>G.achievements.includes("lux_car")},
  {id:"lux_house",ic:"🏠",n:"豪宅落成",d:"入手一棟豪宅",cond:()=>G.achievements.includes("lux_house")},
  {id:"vet35",ic:"🧓",n:"老而彌堅",d:"35 歲仍在職業賽場",cond:()=>G.age>=35},
];

function checkMilestones(){
  if(!G || !G.achievements) return;
  ACHIEVEMENTS.forEach(a=>{
    if(!G.achievements.includes(a.id) && a.cond()){
      G.achievements.push(a.id);
      logEvent("🏆",`成就解鎖：${a.ic} ${a.n}`,"log-gold");
      toast(`🏆 成就解鎖：${a.n}`);
    }
  });
}

/* ============================================================
   EVENT MODAL SYSTEM
   ============================================================ */
let _afterEvent=null;
function showEvent({emoji,title,text,choices,after}){
  _afterEvent=after||null;
  showModalCustom(`
    <div class="emoji">${emoji}</div>
    <h3>${title}</h3>
    <p>${text}</p>
    <div style="margin-top:12px;">
    ${choices.map((c,i)=>`<button class="choice" onclick="pickChoice(${i})"><span class="ci">${c.i}</span>${c.t}${c.cost?`<span class="cost">${c.cost}</span>`:""}</button>`).join("")}
    </div>
  `);
  window._choices=choices;
}
function pickChoice(i){
  const c=window._choices[i];
  closeModal();
  if(c.fn) c.fn();
  save();
  const af=_afterEvent; _afterEvent=null;
  if(af){ af(); } else { render(); }
  checkMilestones();
}

function showModalCustom(html){
  let ov=$("#overlay");
  if(!ov){
    ov=document.createElement("div");
    ov.id="overlay"; ov.className="overlay";
    ov.innerHTML=`<div class="modal" id="modalBox"></div>`;
    ($("#app")||document.body).appendChild(ov);
  }
  $("#modalBox").innerHTML=html;
  requestAnimationFrame(()=>ov.classList.add("show"));
}
function closeModal(){
  const ov=$("#overlay");
  if(ov) ov.classList.remove("show");
}
function closeModalThen(fn){
  closeModal();
  setTimeout(fn,180);
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */
function save(){
  try{ localStorage.setItem("footballLife",JSON.stringify(G)); }catch(e){}
}
function load(){
  try{
    const s=localStorage.getItem("footballLife");
    if(s){ G=JSON.parse(s); return true; }
  }catch(e){}
  return false;
}

/* ============================================================
   BOOT
   ============================================================ */
function showSplash(){
  const el=document.createElement("div");
  el.id="splash";
  el.innerHTML=`<img class="sp-logo logo-stroke" src="${LOGO}" alt="Football Life"><div class="sp-sub">足 球 生 涯</div><div class="sp-bar"><i></i></div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.classList.add("hide"); setTimeout(()=>el.remove(),550); }, 1500);
}
function mountDecor(){
  if(document.getElementById("appdecor")) return;
  const d=document.createElement("div"); d.id="appdecor";
  d.innerHTML=`<img class="l" src="${LOGO}" alt=""><img class="r" src="${LOGO}" alt="">`;
  document.body.insertBefore(d, document.body.firstChild);
}
// 舊存檔屬性 → 新六維遷移
function migrateAttrs(){
  if(!G||!G.attr) return;
  const a=G.attr;
  const need = G.pos==='GK'? ['diving','handling','kicking','positioning','reflexes','speed'] : ['pace','shooting','passing','dribbling','defending','physical'];
  if(need.every(k=>a[k]!=null)) return; // 已是新格式
  const old=Object.assign({},a);
  const v=(k,d)=> old[k]!=null? old[k] : d;
  if(G.pos==='GK'){
    G.attr={ diving:v('reflex',60), handling:v('handling',60), kicking:v('passing',v('kicking',55)),
      positioning:v('positioning',60), reflexes:v('reflex',60), speed:v('pace',55) };
  } else {
    G.attr={ pace:v('pace',55), shooting:v('shooting',55), passing:v('passing',55),
      dribbling:v('dribble',v('dribbling',55)), defending:v('tackle',v('defending',v('positioning',50))),
      physical:v('strength',v('physical',v('stamina',55))) };
  }
  Object.keys(G.attr).forEach(k=>{ G.attr[k]=clamp(Math.round(G.attr[k]||50),20,99); });
  G.overall=calcOverall();
}
function togglePhoneMode(){
  const on=!document.body.classList.contains('phone-mode');
  document.body.classList.toggle('phone-mode', on);
  const b=document.getElementById('phoneToggle'); if(b){ b.classList.toggle('on',on); b.title=on?'退出手機模式':'手機模式預覽'; }
  try{ localStorage.setItem('fl_phone', on?'1':'0'); }catch(e){}
}
function mountPhoneToggle(){
  if(document.getElementById('phoneToggle')) return;
  const b=document.createElement('button'); b.id='phoneToggle'; b.title='手機模式預覽'; b.textContent='📱';
  b.onclick=togglePhoneMode; document.body.appendChild(b);
  if(localStorage.getItem('fl_phone')==='1'){ document.body.classList.add('phone-mode'); b.classList.add('on'); }
}
/* ---- 生涯開始人數統計（公開計數 API；失敗則靜默隱藏，不影響遊戲） ---- */
const COUNTER_BASE="https://abacus.jasoncameron.dev";
const COUNTER_NS="football-life-2026";
const COUNTER_KEY="career-starts";
function _counterShow(n){
  const el=document.getElementById("careerCounter"); if(!el) return;
  const b=el.querySelector("b");
  if(n!=null && b){ b.textContent=Number(n).toLocaleString("en-US"); el.style.display=""; }
}
async function loadCareerCounter(){
  try{
    const r=await fetch(`${COUNTER_BASE}/get/${COUNTER_NS}/${COUNTER_KEY}`,{cache:"no-store"});
    if(!r.ok) return;
    const d=await r.json();
    _counterShow(d && (d.value!=null?d.value:d.count));
  }catch(e){ /* 離線 / API 無回應：保持隱藏 */ }
}
async function bumpCareerCounter(){
  try{
    const r=await fetch(`${COUNTER_BASE}/hit/${COUNTER_NS}/${COUNTER_KEY}`,{cache:"no-store"});
    if(!r.ok) return;
    const d=await r.json();
    _counterShow(d && (d.value!=null?d.value:d.count));   // 開始生涯後即時 +1
  }catch(e){}
}

function boot(){
  mountDecor();
  mountPhoneToggle();
  if(load() && G && !G.setup){
    migrateAttrs();
    G.screen="home";   // 每次重新載入固定回到首頁
    // 若積分榜仍含臨時填充球隊，且該聯賽現已有更多真實球隊，重建積分榜
    if(G.club && G.lg && G.lg.teams){
      const hasFiller=G.lg.teams.some(t=>/勁旅/.test(t.n));
      const realCount=TIER_ORDER.reduce((s,t)=>s+((CLUBS[t]||[]).filter(c=>c.l===G.league).length),0);
      if(hasFiller && realCount>G.lg.teams.filter(t=>!/勁旅/.test(t.n)).length) buildLeague();
    }
    render();
  } else {
    G=null; renderSetup();
  }
  showSplash();
}
boot();
</script>
