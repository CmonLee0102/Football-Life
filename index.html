<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Life 足球生涯</title>
<style>
  :root{
    --bg:#050506; --bg2:#0c0c10; --panel:#141419; --panel2:#1c1c23;
    --line:#2a2a34; --accent:#f5c451; --accent2:#d99b1f; --gold:#f5c451;
    --txt:#f3f3f6; --dim:#8b8b98; --red:#f2557a; --blue:#54a8ff; --pink:#ec4899;
    --purple:#a855f7; --orange:#f97316; --ink:#1a1405;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; max-width:100%; overflow-x:hidden;}
  body{
    font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(1300px 700px at 50% -12%, rgba(245,196,81,.11), transparent 60%),
      radial-gradient(1000px 700px at 0% 100%, rgba(242,85,122,.07), transparent 55%),
      radial-gradient(1000px 700px at 100% 100%, rgba(84,168,255,.06), transparent 55%),
      radial-gradient(1600px 900px at 50% 120%, rgba(0,0,0,.5), transparent 60%),
      #060608;
    background-attachment:fixed;
    color:var(--txt); overflow:hidden; letter-spacing:.2px;
  }
  /* 兩側品牌氛圍浮水印（填滿整個畫面，不留空黑） */
  #appdecor{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  #appdecor img{position:absolute; width:min(48vw,640px); opacity:.045; filter:grayscale(.15) blur(.5px);}
  #appdecor .l{left:-7vw; top:9vh; transform:rotate(-9deg);}
  #appdecor .r{right:-7vw; bottom:7vh; transform:rotate(9deg);}
  /* 手機：滿版原尺寸，字體與間距清楚不擠、不側滑 */
  #app{width:100%; height:100dvh; max-width:100%; overflow-x:hidden;
    display:flex; flex-direction:column; position:relative; z-index:1;}
  /* 桌機才套用整體 90% 比例。用 zoom 而非 transform:scale——
     transform:scale 的盒子仍佔原尺寸寬度，會多出橫向捲軸（側滑）；zoom 會真正縮放版面，不會側滑。 */
  @media (min-width:721px){
    #app{zoom:0.9; width:calc(100% / 0.9); height:calc(100dvh / 0.9);}
  }
  /* 置中的 App 主欄，坐落在氛圍背景之上 */
  #root{display:flex; flex-direction:column; flex:1; min-height:0; width:100%; max-width:920px; margin:0 auto; overflow-x:hidden;
    background:linear-gradient(180deg,rgba(16,16,20,.72),rgba(6,6,9,.72));
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 40px 120px rgba(0,0,0,.6);}

  /* Scrollable content */
  .screen{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 24px; display:flex; flex-direction:column;}
  .screen::-webkit-scrollbar{width:0;}
  @media (min-width:560px){ .screen{padding:20px 24px 28px;} }
  /* 首頁內容垂直置中（內容多時仍可正常捲動） */
  .home-center{margin:auto 0; width:100%;}
  /* 首頁整體外框：灰色框把所有內容框起來（仿 Racing Life 的漂浮面板） */
  .home-frame{border:1px solid rgba(185,189,201,.28); border-radius:26px; padding:26px 22px 28px; margin:12px 0 8px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.20));
    box-shadow:0 22px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);}
  @media (max-width:640px){ .home-frame{padding:18px 14px 20px; border-radius:20px; margin:8px 0 8px;} }
  .home-title{margin-top:12px; font-size:26px; font-weight:900; letter-spacing:6px; line-height:1.1;
    background:linear-gradient(180deg,#ffe9a8,#f5c451 55%,#d99b1f); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:var(--gold); filter:drop-shadow(0 2px 10px rgba(245,196,81,.28));}
  .home-sub{margin-top:8px; font-size:10.5px; letter-spacing:2px; color:var(--dim); font-weight:700; text-transform:uppercase;}
  .home-divider{height:1px; margin:16px 2px 2px; background:linear-gradient(90deg,transparent,rgba(245,196,81,.4),transparent);}
  /* 內容多時子元素不被 flex 壓縮，改為正常捲動（避免按鈕被擠扁） */
  .screen > *{flex-shrink:0;}
  /* 圖片/向量圖不超出容器，避免水平側滑 */
  img, svg, canvas, video{max-width:100%;}
  /* 手機排版：兩欄容器自動改單欄堆疊、拉開間距、不擁擠、不側滑 */
  @media (max-width:640px){
    /* 兩欄版面（聯賽/數據/訓練/生活/商業）在手機改為「垂直堆疊、各佔滿版」，
       避免子欄被 min-width 撐開卻又硬擠在同一列而擠成一團。 */
    [style*="align-items:flex-start"][style*="flex-wrap:wrap"]{flex-direction:column !important; gap:12px !important;}
    [style*="align-items:flex-start"][style*="flex-wrap:wrap"] > *{width:100% !important; min-width:0 !important; flex:1 1 auto !important;}
    .screen{padding:14px 13px 26px;}
    .card{padding:14px; margin-bottom:12px;}
    h1{font-size:21px;}
    h2{font-size:14.5px; margin:14px 0 8px;}
    .kv{font-size:13.5px; padding:9px 0;}
    header{padding:12px 14px; gap:11px;}
    .avatar{width:50px; height:50px;}
    .hd-name{font-size:17px;}
    .hd-money{font-size:18px;}
    nav button{font-size:13px; padding:9px 2px;}
  }
  /* 桌機：主欄變成漂浮的圓角面板，坐落在品牌背景之上 */
  @media (min-width:720px){
    #root{border-radius:24px; margin-top:20px; margin-bottom:20px; overflow:hidden;}
  }

  /* Header */
  header{
    padding:15px 18px; background:linear-gradient(180deg,rgba(22,22,28,.96),rgba(8,8,11,.96));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:13px;
    position:sticky; top:0; z-index:20; box-shadow:0 1px 0 rgba(245,196,81,.08);
  }
  .avatar{width:58px; height:58px; border-radius:16px; background:linear-gradient(135deg,#f7d26b,#c8891a);
    display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0; color:#1a1405;
    box-shadow:0 4px 16px rgba(245,196,81,.3), inset 0 1px 1px rgba(255,255,255,.35);}
  .hd-name{font-weight:800; font-size:19px; line-height:1.2;}
  .hd-sub{font-size:13px; color:var(--dim); margin-top:2px;}
  .hd-right{margin-left:auto; text-align:right;}
  .hd-money{color:var(--gold); font-weight:800; font-size:20px; text-shadow:0 0 14px rgba(245,196,81,.35);}
  .hd-age{font-size:13px; color:var(--dim); margin-top:2px;}

  h1{font-size:23px; margin:0 0 4px; font-weight:800; letter-spacing:.5px;}
  h2{font-size:14px; margin:16px 0 9px; color:var(--gold); display:flex; align-items:center; gap:6px; font-weight:800; letter-spacing:.5px;}
  .muted{color:var(--dim); font-size:12px;}

  /* Cards */
  .card{background:linear-gradient(180deg,#16161c,#111116); border:1px solid var(--line); border-radius:16px;
    padding:15px; margin-bottom:12px; box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);}
  .card.tap{cursor:pointer; transition:transform .1s, border-color .15s;}
  .card.tap:active{transform:scale(.985); border-color:rgba(245,196,81,.4);}

  /* Buttons */
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(180deg,#f7d26b,#d99b1f); color:var(--ink);
    font-weight:800; font-size:16px; cursor:pointer; margin-top:10px; letter-spacing:.5px;
    box-shadow:0 6px 20px rgba(245,196,81,.28), inset 0 1px 1px rgba(255,255,255,.4); transition:transform .09s, box-shadow .15s;
  }
  .btn:active{transform:scale(.98); box-shadow:0 3px 12px rgba(245,196,81,.25);}
  .btn.sec{background:linear-gradient(180deg,#20202a,#181820); color:var(--txt); border:1px solid var(--line); box-shadow:0 3px 12px rgba(0,0,0,.35);}
  .btn.red{background:linear-gradient(180deg,#f2557a,#c73357); color:#fff; box-shadow:0 6px 18px rgba(242,85,122,.28);}
  .btn.gold{background:linear-gradient(180deg,#ffdd78,#e0a010); color:var(--ink); box-shadow:0 6px 20px rgba(245,196,81,.35);}
  .btn:disabled{opacity:.38; cursor:not-allowed;}
  .btn-sm{padding:9px 12px; font-size:13px; margin-top:0; width:auto; display:inline-block;}

  /* Stat bars */
  .stat{margin-bottom:10px;}
  .stat-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .stat-name{color:var(--dim);}
  .stat-val{font-weight:800;}
  .bar{height:8px; background:#0b0b0f; border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .bar-fill{height:100%; border-radius:6px; transition:width .6s cubic-bezier(.3,1,.5,1);}

  /* 手機模式預覽 */
  #phoneToggle{position:fixed; right:14px; bottom:14px; z-index:9999; width:48px; height:48px; border-radius:50%;
    background:linear-gradient(180deg,#20202a,#141419); border:1px solid var(--line); color:var(--gold); font-size:20px; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; transition:transform .15s;}
  #phoneToggle:active{transform:scale(.92);}
  #phoneToggle.on{background:linear-gradient(180deg,#ffdd78,#e0a010); color:#1a1405; box-shadow:0 6px 22px rgba(245,196,81,.45);}
  /* 手機模式：縮小顯示（一次看到更多），比例合理且完整置中、隨視窗高度自動縮放 */
  body.phone-mode{overflow:auto; display:flex; align-items:center; justify-content:center; min-height:100dvh;}
  body.phone-mode #app{ zoom:.9; flex:0 0 auto; width:400px!important; max-width:400px!important; height:min(790px, calc(90dvh / .9))!important; margin:0!important;
    border:12px solid #0c0c10!important; border-radius:46px!important; box-shadow:0 0 0 2px #2c2c34, 0 34px 90px rgba(0,0,0,.85)!important;
    overflow:hidden!important; transform:none!important; position:relative;}
  body.phone-mode #root{margin:0!important; border-radius:0!important; max-width:none!important;}
  @media (max-width:640px){ #phoneToggle{display:none;} body.phone-mode{display:block;} body.phone-mode #app{zoom:1!important; width:100%!important; border:none!important; border-radius:0!important; height:100dvh!important; margin:0!important; box-shadow:none!important;} }
  /* 窄螢幕（真手機）：戰績卡更精簡 */
  @media (max-width:640px){
    .statcard{padding:15px 13px;}
    .statcard .radar{max-width:186px;}
    .statcard .sc-in > div{margin-top:9px!important;}
  }
  /* 投資介面 */
  .inv-riskpill{display:inline-block; font-size:11px; font-weight:800; padding:3px 13px; border-radius:999px; letter-spacing:.5px;}
  .inv-stat{flex:1; text-align:center; background:linear-gradient(180deg,#16161c,#101015); border:1px solid var(--line); border-radius:12px; padding:9px 4px;}
  .inv-stat-v{font-weight:900; font-size:16px;}
  .inv-stat-l{font-size:10px; color:var(--dim); margin-top:2px;}
  .inv-range-bar{display:flex; height:9px; border-radius:5px; overflow:hidden; background:#0b0b0f; box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .inv-range-loss{background:linear-gradient(90deg,#c73357,#f2557a); transition:width .15s;}
  .inv-range-gain{background:linear-gradient(90deg,#2f9d55,#5ad07a); transition:width .15s;}
  /* 滑桿 (投資金額進度條) */
  input[type=range]{-webkit-appearance:none; appearance:none; height:8px; border-radius:5px; background:#33333c; outline:none; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:linear-gradient(180deg,#ffdd78,#e0a010); box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.5); cursor:pointer; margin-top:-1px;}
  input[type=range]::-moz-range-thumb{width:22px; height:22px; border:none; border-radius:50%; background:linear-gradient(180deg,#ffdd78,#e0a010); box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;}
  /* 環形進度儀表 */
  .ring{width:60px; height:60px; margin:0 auto; border-radius:50%; position:relative;
    background:conic-gradient(var(--c) calc(var(--p)*1%), rgba(255,255,255,.07) 0);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 12px -2px var(--c);}
  .ring::after{content:""; position:absolute; inset:5px; border-radius:50%; background:linear-gradient(180deg,#16161c,#0e0e13);}
  .ring-in{position:relative; z-index:1; font-weight:900; font-size:17px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px;}
  .sc-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
  @media (max-width:480px){ .sc-grid{grid-template-columns:1fr 1fr; gap:10px;} }

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
    background:var(--panel2); border:1px solid var(--line);}

  .kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--dim);}
  .kv .v{font-weight:800;}

  /* Bottom nav */
  nav{
    flex-shrink:0; display:flex;
    background:linear-gradient(180deg,rgba(14,14,18,.97),rgba(8,8,11,.97)); border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:6px 4px;
  }
  nav button{flex:1; background:none; border:none; color:var(--dim); font-size:14px; font-weight:700; letter-spacing:.5px;
    padding:9px 4px; border-radius:9px; cursor:pointer; transition:color .15s, background .15s, text-shadow .15s; position:relative;}
  nav button:hover{color:#fff; background:rgba(245,196,81,.22); text-shadow:0 0 16px rgba(245,196,81,.95), 0 0 6px rgba(255,255,255,.6); box-shadow:inset 0 0 0 1px rgba(245,196,81,.5); transform:translateY(-1px);}
  nav button.active{color:var(--ink); font-weight:900; background:linear-gradient(180deg,#ffdd78,#e0a010); box-shadow:0 3px 12px rgba(245,196,81,.35), inset 0 1px 1px rgba(255,255,255,.4); text-shadow:none;}
  nav button.active:hover{color:var(--ink); background:linear-gradient(180deg,#ffe38c,#e6a616); text-shadow:none;}
  nav button.active::after{content:""; position:absolute; left:50%; transform:translateX(-50%); bottom:-6px; width:60%; height:3px; border-radius:3px; background:var(--gold); box-shadow:0 0 10px var(--gold); animation:navUnder .3s cubic-bezier(.3,1.3,.5,1);}
  @keyframes navUnder{from{width:0; opacity:0;}to{opacity:1;}}

  /* Event modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s; padding:18px;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{background:linear-gradient(180deg,#1b1b22,#101015); width:100%; max-width:480px;
    border-radius:22px; border:1px solid rgba(245,196,81,.25); padding:24px 20px;
    transform:translateY(14px) scale(.96); opacity:.6; transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s; max-height:88dvh; overflow-y:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.7);}
  .overlay.show .modal{transform:translateY(0) scale(1); opacity:1;}
  .modal .emoji{font-size:48px; text-align:center; margin-bottom:6px; filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));}
  .modal h3{text-align:center; margin:0 0 10px; font-size:20px; font-weight:800;}
  .modal p{color:var(--dim); font-size:14px; line-height:1.6; text-align:center; margin:0 0 6px;}
  .choice{width:100%; padding:14px; margin-top:9px; border-radius:13px; border:1px solid var(--line);
    background:linear-gradient(180deg,#1e1e26,#17171d); color:var(--txt); font-size:15px; font-weight:600; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:11px; transition:border-color .12s, transform .08s;}
  .choice:active{border-color:rgba(245,196,81,.5); transform:scale(.99);}
  .choice .ci{font-size:20px;}
  .choice .cost{margin-left:auto; font-size:11px; color:var(--gold); font-weight:800;}

  /* Log feed */
  .spon-list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .spon-card{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px;
    background:linear-gradient(150deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.08); transition:border-color .15s, transform .1s;}
  .spon-card:not(.lock):not(.done):hover{border-color:rgba(245,196,81,.4);}
  .spon-card.lock{opacity:.5;}
  .spon-card.done{border-color:rgba(120,220,140,.35); background:linear-gradient(150deg,rgba(90,200,120,.08),rgba(255,255,255,.01));}
  .spon-ic{font-size:32px; width:44px; text-align:center; flex-shrink:0;}
  .spon-mid{flex:1; min-width:0;}
  .spon-name{font-weight:800; font-size:15px;}
  .spon-req{font-size:10px; font-weight:700; color:var(--dim); background:rgba(255,255,255,.06); border-radius:6px; padding:1px 6px; margin-left:4px; vertical-align:middle;}
  .spon-desc{font-size:11.5px; color:var(--muted,#9a9a9a); line-height:1.45; margin:3px 0 5px;}
  .spon-pay{font-weight:800; font-size:14px; color:var(--gold);}
  .spon-pay .spon-per{font-size:11px; color:var(--dim); font-weight:600; margin-left:1px;}
  .spon-right{flex-shrink:0;}
  .spon-sign{width:auto; margin:0; padding:9px 18px;}
  .spon-tag{font-size:11px; font-weight:800; padding:5px 10px; border-radius:999px; white-space:nowrap;}
  .spon-tag.done{color:#7fe0a0; background:rgba(120,220,140,.14);}
  .spon-tag.lock{color:var(--dim); background:rgba(255,255,255,.06);}
  /* 賽季總結 */
  .ss-head{text-align:center; padding:6px 0 2px;}
  .ss-badge{width:66px; height:66px; margin:0 auto 6px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px;
    background:linear-gradient(135deg,#ffdd78,#d99b1f); box-shadow:0 8px 24px rgba(245,196,81,.35), inset 0 1px 1px rgba(255,255,255,.5);}
  .ss-season{font-size:11px; letter-spacing:4px; color:var(--gold); font-weight:900;}
  .ss-title{font-size:22px; font-weight:900; letter-spacing:3px; margin-top:2px;}
  .ss-stats{background:linear-gradient(160deg,rgba(245,196,81,.05),rgba(255,255,255,.012));}
  /* 開關 Toggle */
  .switch{width:50px; height:28px; border-radius:999px; background:#2c2c34; border:1px solid var(--line); position:relative; cursor:pointer; transition:background .22s; flex-shrink:0;}
  .switch.on{background:linear-gradient(90deg,#5ad07a,#2f9d55); border-color:transparent;}
  .switch-dot{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.5); transition:transform .22s cubic-bezier(.3,1.4,.5,1);}
  .switch.on .switch-dot{transform:translateX(22px);}
  /* 生涯結算 */
  .rt-hero{margin:24px 0 8px; position:relative;}
  .rt-badge{width:100px; height:100px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-size:54px;
    background:radial-gradient(circle at 50% 34%, rgba(245,196,81,.3), rgba(245,196,81,.04) 72%);
    box-shadow:0 0 0 2px rgba(245,196,81,.45), 0 0 44px rgba(245,196,81,.32), inset 0 0 32px rgba(245,196,81,.16);
    animation:rtGlow 2.6s ease-in-out infinite;}
  @keyframes rtGlow{0%,100%{box-shadow:0 0 0 2px rgba(245,196,81,.4),0 0 34px rgba(245,196,81,.26),inset 0 0 28px rgba(245,196,81,.14);}50%{box-shadow:0 0 0 2px rgba(245,196,81,.55),0 0 52px rgba(245,196,81,.4),inset 0 0 34px rgba(245,196,81,.2);}}
  .rt-h1{font-size:22px; margin:6px 0 4px; letter-spacing:4px; font-weight:800;}
  .rt-title{font-size:20px; font-weight:900; letter-spacing:1.5px;
    background:linear-gradient(180deg,#ffe9a8,#f5c451 55%,#d99b1f); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--gold);
    filter:drop-shadow(0 2px 12px rgba(245,196,81,.4));}
  .rt-titles-card{background:linear-gradient(160deg,rgba(245,196,81,.07),rgba(255,255,255,.015)); border-color:rgba(245,196,81,.3)!important;}
  .rt-chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .rt-chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px;
    background:linear-gradient(180deg,rgba(245,196,81,.18),rgba(245,196,81,.05)); border:1px solid rgba(245,196,81,.42); color:var(--txt);
    box-shadow:0 2px 8px rgba(0,0,0,.3);}
  /* 能力雷達圖：載入時由中心擴張 */
  .radar-shape{ animation:radarGrow .75s cubic-bezier(.22,1,.36,1); }
  @keyframes radarGrow{ from{ transform:scale(0); opacity:.2; } to{ transform:scale(1); opacity:1; } }
  /* 生涯軌跡時間軸 */
  .cpath{position:relative;}
  .cpath-row{display:flex; align-items:center; gap:12px; position:relative; padding:9px 0 9px 2px;}
  .cpath-row:not(:last-child)::after{content:""; position:absolute; left:6px; top:calc(50% + 8px); height:calc(100% - 8px); width:2px; background:linear-gradient(180deg,rgba(245,196,81,.5),rgba(245,196,81,.15));}
  .cpath-dot{width:14px; height:14px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px rgba(245,196,81,.6), inset 0 0 0 3px #0b0b10; flex-shrink:0; position:relative; z-index:1;}
  .cpath-badge{width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; flex-shrink:0;}
  /* 戰績卡 */
  .statcard{position:relative; border:5px solid #888; border-radius:20px; padding:20px 18px; margin:4px 0 12px; overflow:hidden;}
  .statcard .sc-shine{position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 47%,rgba(255,255,255,.02) 55%,transparent 70%); pointer-events:none; z-index:1;}
  .statcard .sc-in{position:relative; z-index:2;}
  .sc-rivet{position:absolute; width:8px; height:8px; border-radius:50%; z-index:3;
    background:radial-gradient(circle at 35% 30%, #f2f2f2, #9a9aa2 55%, #3a3a40); box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 0 2px rgba(0,0,0,.5);}
  .ct-badge{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:9px;}
  .ct-badge img{width:26px; height:26px; object-fit:contain;}
  .sc-pill{display:inline-block; font-size:10px; font-weight:800; padding:5px 11px; border-radius:999px; letter-spacing:.5px;}
  .sc-legend{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:900; padding:7px 13px; border-radius:999px; box-shadow:0 3px 12px rgba(0,0,0,.45);}
  .sc-tier{display:inline-block; font-size:10px; font-weight:900; letter-spacing:1px; padding:2px 9px; border-radius:999px; vertical-align:middle;}
  .statcard.rainbow{border-color:transparent; background-clip:padding-box;}
  .statcard.rainbow::before{content:""; position:absolute; inset:-3px; z-index:-0; border-radius:22px;
    background:conic-gradient(from 0deg,#ff5d5d,#ffd25d,#5dff9e,#5db8ff,#c05dff,#ff5d5d); filter:blur(.5px); animation:scSpin 6s linear infinite;}
  .statcard.rainbow::after{content:""; position:absolute; inset:0; border-radius:19px; z-index:0;
    background:
      repeating-linear-gradient(45deg, rgba(255,110,110,.28) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(-45deg, rgba(110,180,255,.28) 0 1px, transparent 1px 11px),
      radial-gradient(130% 85% at 50% -8%, rgba(200,140,255,.16), transparent 58%),
      linear-gradient(150deg,#141018,#0a0a10);}
  .statcard.rainbow > *{position:relative; z-index:1;}
  @keyframes scSpin{to{transform:rotate(360deg);}}
  .howto{background:linear-gradient(160deg,rgba(245,196,81,.05),rgba(255,255,255,.015)); transition:border-color .25s;}
  .howto.open{border-color:rgba(245,196,81,.3);}
  .howto-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none;}
  .howto-arrow{display:inline-block; transition:transform .35s cubic-bezier(.4,0,.2,1);}
  .howto.open .howto-arrow{transform:rotate(180deg);}
  /* 用 grid-template-rows 0fr→1fr 做平滑高度展開，比 max-height 更自然 */
  .howto-wrap{display:grid; grid-template-rows:0fr; transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1);}
  .howto.open .howto-wrap{grid-template-rows:1fr;}
  .howto-body{min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:12px;
    opacity:0; transform:translateY(-4px); transition:opacity .3s ease .05s, transform .3s ease .05s, margin-top .38s;}
  .howto.open .howto-body{opacity:1; transform:none; margin-top:12px;}
  .howto-row{display:flex; gap:12px; align-items:flex-start;}
  .howto-ic{font-size:20px; flex-shrink:0; width:26px; text-align:center;}
  .howto-t{font-weight:800; font-size:13px; color:var(--gold);}
  .howto-d{font-size:12px; color:var(--muted,#9a9a9a); line-height:1.55; margin-top:2px;}
  .trophy-room{background:linear-gradient(160deg,rgba(245,196,81,.06),rgba(255,255,255,.02));}
  .tro-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .tro-chip{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; font-size:12px; font-weight:800;
    background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(245,196,81,.05)); border:1px solid rgba(245,196,81,.35); color:var(--txt);}
  .tro-chip .tro-x{color:var(--gold); font-size:12px; font-weight:900;}
  .tro-list{margin-top:4px;}
  .tro-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.05);}
  .tro-row:last-child{border-bottom:none;}
  .tro-season{font-size:10px; font-weight:800; color:var(--gold); background:rgba(245,196,81,.12); border-radius:6px; padding:2px 7px; flex-shrink:0; min-width:52px; text-align:center;}
  .tro-title{font-size:13px; font-weight:700;}
  .tro-toggle{text-align:center; padding:9px 8px 2px; color:var(--gold); cursor:pointer; font-weight:800; font-size:13px; user-select:none;}
  .log-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13px; line-height:1.5;}
  .log-item .li-ico{font-size:18px; flex-shrink:0;}
  .log-item .li-time{color:var(--dim); font-size:10px;}
  .log-good{color:var(--gold);}
  .log-bad{color:var(--red);}
  .log-gold{color:var(--gold);}

  /* Match result */
  .score{font-size:42px; font-weight:900; text-align:center; letter-spacing:2px;}
  .match-teams{display:flex; align-items:center; justify-content:space-around; margin:8px 0;}
  .match-teams .tm{text-align:center; flex:1;}
  .match-teams .tm .nm{font-size:13px; font-weight:700;}
  .rating{display:inline-block; padding:5px 14px; border-radius:11px; font-weight:900; font-size:20px;}

  /* Setup */
  .opt-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .opt{flex:1; min-width:0; padding:11px 6px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(180deg,#16161c,#111116); text-align:center; cursor:pointer; font-size:13px; font-weight:600; transition:all .12s;}
  .opt.on{background:linear-gradient(180deg,#f7d26b,#d99b1f); color:var(--ink); border-color:var(--gold); box-shadow:0 4px 14px rgba(245,196,81,.25);}
  /* 世界地圖選國籍 */
  .worldmap-wrap{background:radial-gradient(circle at 50% 40%,#0f1a2a,#08101a); border:1px solid var(--line); border-radius:16px; padding:10px; margin-bottom:12px; box-shadow:inset 0 0 30px rgba(0,0,0,.5);}
  .worldmap{width:100%; height:auto; display:block; border-radius:10px;}
  .worldmap image{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); image-rendering:auto;}
  .worldmap .region{fill:transparent; cursor:pointer; transition:fill .15s, stroke .15s; rx:14px; ry:14px;}
  .worldmap .region:hover{fill:rgba(245,196,81,.09);}
  .worldmap .region.reg-on{fill:rgba(245,196,81,.12); stroke:var(--gold); stroke-width:1.6; stroke-dasharray:6 4; filter:drop-shadow(0 0 5px rgba(245,196,81,.7));}
  .worldmap .reg-label{fill:#e7edf5; font-weight:800; text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:#0a111c; stroke-width:3px;}
  .bg-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  @media (max-width:430px){ .bg-grid{grid-template-columns:1fr;} }
  .bg-card{margin-bottom:0;}
  .bg-card .bg-check{display:none;}
  .bg-card.bg-on{border-color:var(--gold); background:linear-gradient(180deg,#211d10,#15110a);}
  .bg-card.bg-on .bg-check{display:block;}
  input[type=text],input[type=number]{width:100%; padding:14px; border-radius:13px; border:1px solid var(--line);
    background:#0e0e12; color:var(--txt); font-size:16px; font-family:inherit;}
  input[type=text]:focus,input[type=number]:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,196,81,.15);}

  .center{text-align:center;}
  .toast{position:fixed; top:70px; left:50%; transform:translateX(-50%); background:linear-gradient(180deg,#20202a,#141419); border:1px solid rgba(245,196,81,.5);
    padding:11px 20px; border-radius:13px; font-size:13px; font-weight:700; z-index:200; opacity:0; transition:opacity .3s;
    max-width:90%; text-align:center; box-shadow:0 8px 26px rgba(0,0,0,.5);}
  .toast.show{opacity:1;}
  .flash{animation:flash .5s;}
  @keyframes flash{0%{background:rgba(245,196,81,.18);}100%{background:transparent;}}
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .tag{font-size:10px; padding:2px 7px; border-radius:8px; font-weight:700; margin-left:5px;}
  .fade{animation:fade .38s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
  .big-emoji{font-size:60px; text-align:center;}
  .season-title{font-size:12px; color:var(--gold); font-weight:800; letter-spacing:1.5px;}
  .badge-img{display:inline-block;} .flag-img{display:inline-block;}
  /* 成就 */
  .ach-grid{display:flex; flex-direction:column; gap:8px;}
  .ach-grid-2{display:grid; grid-template-columns:1fr; gap:8px;}
  @media (min-width:560px){ .ach-grid-2{grid-template-columns:1fr 1fr;} }
  .ach{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:13px; border:1px solid rgba(255,255,255,.06);
    background:var(--panel2); opacity:.5; transition:opacity .2s, transform .12s, box-shadow .2s; position:relative; overflow:hidden;}
  .ach.got{opacity:1; border-color:rgba(245,196,81,.5); background:linear-gradient(150deg,#2a2412,#16110a); box-shadow:0 3px 14px rgba(245,196,81,.14), inset 0 1px 0 rgba(255,255,255,.05);}
  .ach.got::before{content:""; position:absolute; inset:0; background:linear-gradient(115deg,transparent 40%,rgba(255,220,120,.12) 50%,transparent 60%); pointer-events:none;}
  .ach:not(.got) .ach-ic{filter:grayscale(1) opacity(.55);}
  .ach-ic{font-size:24px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; text-align:center; flex-shrink:0; border-radius:10px; background:rgba(0,0,0,.25);}
  .ach.got .ach-ic{background:radial-gradient(circle at 50% 40%,rgba(245,196,81,.28),rgba(245,196,81,.05)); box-shadow:0 0 12px rgba(245,196,81,.3);}
  .ach-tx{min-width:0;}
  .ach-nm{font-weight:800; font-size:13px;}
  .ach.got .ach-nm{color:var(--gold);}
  .ach-ds{font-size:11px; color:var(--dim); margin-top:2px;}
  .ach-ck{margin-left:auto; color:#1a1405; font-weight:900; font-size:12px; flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:linear-gradient(180deg,#ffdd78,#e0a010); box-shadow:0 2px 8px rgba(245,196,81,.4);}
  /* 選位置：足球場 11 選 1 */
  .pitch-pick{position:relative; width:100%; max-width:360px; margin:10px auto 0; aspect-ratio:3/4;
    background:linear-gradient(180deg,#12472a,#0c331d); border:2px solid #2f6b45; border-radius:16px; overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,.4);
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 9.09%, rgba(255,255,255,0) 9.09% 18.18%),
                     linear-gradient(180deg,#12472a,#0c331d);}
  .pitch-pick::before{content:""; position:absolute; left:6%; right:6%; top:50%; border-top:2px solid rgba(255,255,255,.28); pointer-events:none;}
  .pitch-pick::after{content:""; position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1; transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.28); border-radius:50%; pointer-events:none;}
  .pp-lines{position:absolute; inset:0; pointer-events:none;}
  .pp-lines::before{content:""; position:absolute; left:24%; right:24%; bottom:-2px; height:15%; border:2px solid rgba(255,255,255,.24); border-bottom:none; border-radius:3px 3px 0 0;}
  .pp-lines::after{content:""; position:absolute; left:24%; right:24%; top:-2px; height:15%; border:2px solid rgba(255,255,255,.24); border-top:none; border-radius:0 0 3px 3px;}
  .pp-spot{position:absolute; z-index:3; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,255,255,.55); background:radial-gradient(circle at 50% 32%,#2c2c35,#14141a); color:#fff;
    font-weight:800; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 9px rgba(0,0,0,.55); transition:transform .12s, box-shadow .12s, background .12s;}
  .pp-spot:active{transform:translate(-50%,-50%) scale(.9);}
  .pp-spot.on{border-color:var(--gold); background:linear-gradient(180deg,#f7d26b,#d99b1f); color:#1a1405;
    box-shadow:0 0 0 4px rgba(245,196,81,.28), 0 5px 14px rgba(0,0,0,.5); transform:translate(-50%,-50%) scale(1.14); z-index:4;}

  /* ===== LIVE MATCH ===== */
  .live{position:relative; display:flex; flex-direction:column; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% -8%, #17170f, #050506 66%);}
  .live-flash{animation:liveFlash .6s;}
  @keyframes liveFlash{0%{background-color:rgba(245,196,81,.16);}100%{background-color:transparent;}}
  .live-top{padding:13px 14px 11px; background:linear-gradient(180deg,#16160f,#0a0a08); border-bottom:1px solid rgba(245,196,81,.2);}
  .live-league{text-align:center; font-size:11px; color:var(--gold); letter-spacing:1.5px; font-weight:800;}
  .live-board{display:flex; align-items:center; justify-content:space-between; margin-top:9px;}
  .live-team{flex:1; text-align:center; min-width:0;}
  .live-crest{min-height:36px; display:flex; align-items:center; justify-content:center;}
  .live-tname{font-size:12px; font-weight:700; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .live-scorebox{flex:0 0 auto; text-align:center; padding:5px 15px; margin:0 4px; background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25)); border:1px solid rgba(245,196,81,.28); border-radius:14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 4px 16px rgba(0,0,0,.4);}
  .live-score{font-size:40px; font-weight:900; letter-spacing:2px; display:inline-block; text-shadow:0 2px 24px rgba(245,196,81,.4);}
  .live-clock{font-size:12px; color:var(--gold); font-weight:800; margin-top:1px; letter-spacing:1px;}
  .live-you{text-align:center; font-size:11px; color:var(--dim); margin-top:9px;}
  .live-speed{position:absolute; top:12px; right:12px; z-index:50; background:rgba(20,20,26,.85); border:1px solid var(--line); color:var(--gold); font-weight:800; font-size:12px; padding:6px 11px; border-radius:10px; cursor:pointer; backdrop-filter:blur(4px);}
  .live-speed:active{transform:scale(.95);}
  .score-pop{animation:scorePop .5s;}
  @keyframes scorePop{0%{transform:scale(1);}40%{transform:scale(1.45);}100%{transform:scale(1);}}

  .live-feed{flex:1; min-height:0; overflow-y:auto; padding:10px 14px 8px; display:flex; flex-direction:column;}
  .live-feed::-webkit-scrollbar{width:0;}
  .feed-item{display:flex; gap:9px; align-items:flex-start; padding:9px 11px 9px 12px; margin-bottom:7px; border-radius:12px;
    background:linear-gradient(180deg,#16161c,#111116); border:1px solid var(--line); border-left:3px solid rgba(255,255,255,.14); font-size:13px; line-height:1.45; animation:feedIn .35s;}
  .feed-item.goal{border-color:rgba(245,196,81,.55); border-left-color:var(--gold); background:linear-gradient(180deg,#2a2410,#191509); box-shadow:0 0 16px rgba(245,196,81,.14);}
  .feed-item.oppgoal{border-color:rgba(242,85,122,.5); border-left-color:var(--red); background:linear-gradient(180deg,#2a1418,#1c1013);}
  .feed-item .fi-ic{font-size:18px; flex-shrink:0; line-height:1.4;}
  @keyframes feedIn{from{opacity:0; transform:translateY(-8px) scale(.97);}to{opacity:1; transform:none;}}

  /* 比賽中決策：置中覆蓋於比賽畫面正中央 */
  .live-actions{position:absolute; inset:0; z-index:45; display:none; align-items:center; justify-content:center; padding:22px;
    background:rgba(0,0,0,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);}
  .live-actions.show{display:flex; animation:fade .25s;}
  .live-choicebox{width:100%; max-width:420px; background:linear-gradient(180deg,#1b1b22,#101015);
    border:1px solid rgba(245,196,81,.28); border-radius:20px; padding:20px 18px;
    box-shadow:0 24px 70px rgba(0,0,0,.7); animation:choicePop .3s cubic-bezier(.2,.9,.3,1);}
  @keyframes choicePop{from{transform:scale(.9); opacity:0;}to{transform:scale(1); opacity:1;}}
  .live-prompt{font-size:16px; font-weight:800; text-align:center; margin-bottom:14px; color:var(--gold); line-height:1.4;}
  .live-btn{display:block; width:100%; padding:14px; margin-bottom:9px; border:1px solid var(--line);
    border-radius:13px; background:linear-gradient(180deg,#20202a,#181820); color:var(--txt); font-size:15px; font-weight:700; cursor:pointer;}
  .live-btn:last-child{margin-bottom:0;}
  .live-btn:active{transform:scale(.98); border-color:rgba(245,196,81,.5);}

  .goal-banner{position:absolute; top:44%; left:50%; transform:translate(-50%,-50%) scale(0);
    font-size:48px; font-weight:900; color:var(--gold); text-shadow:0 4px 26px rgba(245,196,81,.8);
    pointer-events:none; z-index:60; letter-spacing:3px; font-style:italic;}
  .goal-banner.show{animation:goalPop 1.2s;}
  @keyframes goalPop{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-14deg); opacity:0;}
    22%{transform:translate(-50%,-50%) scale(1.35) rotate(5deg); opacity:1;}
    65%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1.15); opacity:0;}}

  .shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

  /* ===== SPLASH ===== */
  #splash{position:fixed; inset:0; z-index:999; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 40%, #17170f, #050506 70%);
    opacity:1; transition:opacity .5s ease;}
  #splash.hide{opacity:0; pointer-events:none;}
  #splash .sp-logo{display:block; width:72%; max-width:300px; animation:splashLogo 1s cubic-bezier(.2,.9,.3,1);}
  .logo-stroke{filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));}
  #splash .sp-sub{color:var(--gold); font-weight:800; letter-spacing:3px; font-size:13px; opacity:0; animation:splashSub .7s .35s forwards;}
  #splash .sp-bar{width:120px; height:3px; border-radius:3px; overflow:hidden; background:rgba(255,255,255,.08); margin-top:4px;}
  #splash .sp-bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#f7d26b,#d99b1f); border-radius:3px; animation:splashBar 1.3s ease forwards;}
  @keyframes splashLogo{0%{opacity:0; transform:scale(.82) translateY(8px);}60%{opacity:1;}100%{opacity:1; transform:scale(1) translateY(0);}}
  @keyframes splashSub{to{opacity:1;}}
  @keyframes splashBar{to{width:100%;}}

  /* ===== 介面質感精修（第二輪美化） ===== */
  /* 區塊標題：金色標記條 */
  h2{position:relative; padding-left:13px; align-items:center;}
  h2::before{content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:4px; height:16px; border-radius:3px; background:linear-gradient(180deg,#ffe08a,#d99b1f); box-shadow:0 0 9px rgba(245,196,81,.55);}
  /* 卡片：更柔和的漸層與陰影、頂部微光 */
  .card{background:linear-gradient(180deg,#17171e,#101015); border-color:rgba(255,255,255,.075);
    box-shadow:0 8px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); transition:border-color .18s, transform .12s, box-shadow .18s;}
  .card.tap{cursor:pointer;}
  .card.tap:hover{border-color:rgba(245,196,81,.35); transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.55);}
  .card.tap:active{transform:translateY(0) scale(.99);}
  /* 按鈕：頂部光澤 + 更立體 */
  .btn{position:relative; overflow:hidden; letter-spacing:1px;}
  .btn::after{content:""; position:absolute; inset:0 0 55% 0; background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0)); pointer-events:none;}
  .btn.sec::after{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0));}
  .btn:hover{filter:brightness(1.06);}
  /* pill 標籤：漸層 */
  .pill{background:linear-gradient(180deg,#20202a,#16161e); border-color:rgba(255,255,255,.09);}
  /* 能力條 / 進度條：內陰影 + 頂部反光 */
  .bar{height:9px; background:#0a0a0f; box-shadow:inset 0 1px 3px rgba(0,0,0,.75);}
  .bar-fill{position:relative;}
  .bar-fill::after{content:""; position:absolute; left:0; right:0; top:0; height:45%; border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0)); pointer-events:none;}
  /* kv 分隔更細緻 */
  .kv{border-bottom-color:rgba(255,255,255,.055);}
  /* 選項 / 事件按鈕：懸停微亮 */
  .choice{transition:border-color .14s, transform .08s, background .15s;}
  .choice:hover{border-color:rgba(245,196,81,.4); background:linear-gradient(180deg,#23222c,#191921);}
  .live-btn:hover{border-color:rgba(245,196,81,.45); filter:brightness(1.08);}
  /* 迷你數值卡輕微金邊懸停 */
  .grid3 .card:hover, .grid2 .card:hover{border-color:rgba(245,196,81,.25);}
  /* 標題文字微光 */
  h1{text-shadow:0 2px 18px rgba(0,0,0,.5);}
</style>
</head>

const $ = s => document.querySelector(s);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random()*100 < p;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmt = n => n.toLocaleString('en-US');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
// 數字滾動上升動畫
function animateCount(el,to,dur,dec){
  if(!el) return; dur=dur||650; dec=dec||0;
  let startTs=null;
  function step(ts){
    if(startTs===null) startTs=ts;
    const t=Math.min(1,(ts-startTs)/dur);
    const e=1-Math.pow(1-t,3);
    const v=to*e;
    el.textContent = dec? v.toFixed(dec) : Math.round(v);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = dec? to.toFixed(dec) : Math.round(to);
  }
  requestAnimationFrame(step);
}
function animateMoney(el,to,dur){
  if(!el) return; dur=dur||900;
  let startTs=null;
  function step(ts){
    if(startTs===null) startTs=ts;
    const t=Math.min(1,(ts-startTs)/dur);
    const e=1-Math.pow(1-t,3);
    el.textContent = moneyStr(to*e);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = moneyStr(to);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   真實球隊徽章 / 國旗 載入模組
   - 球隊徽章：Football-Data.org 免費徽章 CDN（無需金鑰）
   - 國旗：flagcdn.com 免費 CDN（Windows 亦正常顯示）
   - 優雅降級：載入失敗 → 隊名字首圓形徽章 / emoji，並快取失敗 URL
   ============================================================ */
const CREST_CDN = "https://crests.football-data.org/"; // {id}.png
const FLAG_CDN  = "https://flagcdn.com/w40/";          // {iso}.png
let BADGE_FAIL = {};
try{ BADGE_FAIL = JSON.parse(localStorage.getItem("fl_badgeFail")||"{}"); }catch(e){ BADGE_FAIL={}; }
function markBadgeFail(url){ if(!url) return; BADGE_FAIL[url]=1; try{ localStorage.setItem("fl_badgeFail",JSON.stringify(BADGE_FAIL)); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;"); }
function hashHue(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))%360; } return h; }
// 圓形字首徽章（fallback）
function monogram(name,size){
  const ch=(name||"?").trim().slice(0,1);
  const hue=hashHue(name||"?");
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:hsl(${hue},42%,34%);color:#fff;font-size:${Math.round(size*0.5)}px;font-weight:800;vertical-align:middle;flex-shrink:0;">${esc(ch)}</span>`;
}
// 圖片載入失敗 → 換成字首徽章
function badgeErr(img){
  markBadgeFail(img.getAttribute("src"));
  const name=img.dataset.name||"?"; const size=+img.dataset.size||28;
  img.outerHTML = monogram(name,size);
}
// 球隊徽章 HTML
function clubBadge(club,size){
  size=size||28;
  if(!club) return monogram("?",size);
  const emb=(typeof CLUB_BADGES!=='undefined')&&CLUB_BADGES[club.n];
  if(emb){
    return `<img class="badge-img" src="${emb}" width="${size}" height="${size}" loading="lazy" style="object-fit:contain;vertical-align:middle;flex-shrink:0;">`;
  }
  if(club.fl){
    const url=`https://assets.footylogos.com/previews/${club.fl}/${club.fl}-logo-footylogos-320.webp`;
    if(!BADGE_FAIL[url]){
      return `<img class="badge-img" src="${url}" width="${size}" height="${size}" loading="lazy" data-name="${esc(club.n)}" data-size="${size}" style="object-fit:contain;vertical-align:middle;flex-shrink:0;" onerror="badgeErr(this)">`;
    }
  }
  if(club.logo){
    const url=CREST_CDN+club.logo+".png";
    if(!BADGE_FAIL[url]){
      return `<img class="badge-img" src="${url}" width="${size}" height="${size}" loading="lazy" data-name="${esc(club.n)}" data-size="${size}" style="object-fit:contain;vertical-align:middle;flex-shrink:0;" onerror="badgeErr(this)">`;
    }
  }
  return monogram(club.n,size);
}
// 國旗 HTML
function natFlag(nation,size){
  size=size||18;
  if(!nation) return "";
  if(nation.iso){
    const url=FLAG_CDN+nation.iso+".png";
    if(!BADGE_FAIL[url]){
      const h=Math.round(size*0.72);
      return `<img class="flag-img" src="${url}" width="${size}" height="${h}" loading="lazy" data-name="${esc(nation.n)}" data-size="${size}" style="object-fit:cover;border-radius:2px;vertical-align:middle;box-shadow:0 0 0 1px rgba(255,255,255,.12);" onerror="badgeErr(this)">`;
    }
  }
  return `<span style="vertical-align:middle;">${nation.f||""}</span>`;
}

const LEAGUE_LIGHT=new Set(["西甲"]); // 亮色 logo，不需白框
function leagueLogo(lg,size){
  const slug=LEAGUE_LOGOS[lg]; if(!slug) return '';
  size=size||22;
  const img=`<img src="https://assets.footylogos.com/previews/${slug}/${slug}-logo-footylogos-320.webp" width="${size}" height="${size}" loading="lazy" style="object-fit:contain;" onerror="(this.closest('span.lglogo')||this).style.display='none'">`;
  if(LEAGUE_LIGHT.has(lg)) return `<span class="lglogo" style="display:inline-flex; align-items:center; vertical-align:middle; line-height:0; flex-shrink:0;">${img}</span>`;
  // 暗色 logo → 白色圓角框
  const pad=Math.max(2,Math.round(size*0.14)), br=Math.max(3,Math.round(size*0.24));
  return `<span class="lglogo" style="display:inline-flex; align-items:center; background:#fff; border-radius:${br}px; padding:${pad}px; vertical-align:middle; line-height:0; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.3);">${img}</span>`;
}

/* ---------- Stat helpers ---------- */
function baseAttrs(pos){
  // 0-99 scale, young player — FIFA 式六維
  const g = ()=>rand(40,58);
  if(pos==="GK") return {diving:g(), handling:g(), kicking:g(), positioning:g(), reflexes:g(), speed:g()};
  return {pace:g(), shooting:g(), passing:g(), dribbling:g(), defending:g(), physical:g()};
}

function calcOverall(){
  const a=G.attr, p=G.pos;
  let keys;
  if(p==="GK") keys=[["diving",3],["reflexes",3],["handling",2],["positioning",2],["kicking",1],["speed",1]];
  else if(p==="DF") keys=[["defending",3],["physical",2],["pace",2],["passing",1],["dribbling",1],["shooting",1]];
  else if(p==="MF") keys=[["passing",3],["dribbling",2],["pace",1],["shooting",1],["defending",1],["physical",1]];
  else keys=[["shooting",3],["pace",2],["dribbling",2],["passing",1],["physical",1],["defending",1]];
  let sum=0,w=0;
  keys.forEach(([k,wt])=>{sum+=(a[k]||0)*wt; w+=wt;});
  const ov=Math.round(sum/w);
  if(G) G.peakOverall=Math.max(G.peakOverall||0, ov); // 追蹤生涯巔峰能力
  return ov;
}

function progressPotential(){
  // Younger players closer to potential grow faster
  if(G.age>=34) return;
  const gap = G.potential - G.overall;
  if(gap<=0) return;
  // training/season growth handled elsewhere
}

}

function beep(freq,dur,type,vol,delay){ if(!soundOn())return; const ac=_ac(); if(!ac)return; const t=ac.currentTime+(delay||0); const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(vol||0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15)); o.start(t); o.stop(t+(dur||0.16)); }

function signClub(club,tier,silent){
  // 生涯軌跡：記錄效力過的球隊與年份
  if(!G.clubHistory) G.clubHistory=[];
  const last=G.clubHistory[G.clubHistory.length-1];
  if(!last || last.n!==club.n){
    if(last && last.end==null) last.end=G.season||1;
    G.clubHistory.push({n:club.n, club, l:club.l, tier, start:G.season||1, end:null});
  }
  const changed = G.club && G.club.n!==club.n;
  G.club=club; G.tier=tier; G.league=club.l;
  const [lo,hi]=TIER_WAGE[tier];
  G.wage=rand(lo,hi);
  G.contractYears=rand(2,4);
  // 新環境：教練信任、更衣室、球迷都要重新建立（名氣高則球迷起點稍高）
  if(changed){ G.coachRel=55; G.chem=50; G.fanRel=clamp(40+Math.round((G.fame||0)/6),0,70); }
  if(!silent) logEvent("✍️",`簽約加盟 ${club.n}（${club.l}），週薪 ${moneyStr(G.wage)}。`,"log-gold");
}

function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function cardTier(ovr){
  if(ovr>=96) return {key:'rainbow',label:'流動彩',main:'#ff5db1',pal:['#ff5d5d','#ffd25d','#5dff9e','#5db8ff','#c05dff'],rainbow:true};
  if(ovr>=91) return {key:'amethyst',label:'紫金級',main:'#c79bff',pal:['#7d3ff5','#c79bff','#ffd873']};
  if(ovr>=81) return {key:'diamond',label:'鑽石級',main:'#5fd3ff',pal:['#2f9fd0','#7fe3ff','#d6f6ff']};
  if(ovr>=71) return {key:'gold',label:'金級',main:'#f5c451',pal:['#d99b1f','#f5c451','#ffe9a8']};
  if(ovr>=61) return {key:'silver',label:'銀級',main:'#c3c7d2',pal:['#8b8f9c','#c9cdd8','#eef0f5']};
  return {key:'bronze',label:'銅級',main:'#c07a34',pal:['#8a5522','#c07a34','#e0a15c']};
}
// 巔峰能力超越的球員百分比（近似真實球員金字塔）
function peakPercentile(ovr){
  let p;
  if(ovr>=96) p=99.9;
  else if(ovr>=91) p=99+(ovr-91)*0.16;
  else if(ovr>=81) p=95+(ovr-81)*0.4;
  else if(ovr>=71) p=85+(ovr-71)*1.0;

    const Y=v=> iy+(1-(clamp(v,mn,mx)-mn)/(mx-mn))*ih;
    ctx.strokeStyle=t.main; ctx.lineWidth=2; ctx.beginPath(); vals.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    vals.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(X(i),Y(v),2.4,0,7); ctx.fillStyle=v>=7.5?'#ffd257':t.main; ctx.fill(); });
  } else { ctx.textAlign='center'; ctx.fillStyle='#8b8b98'; font(11,600); ctx.fillText('賽季不足，尚無趨勢圖',W/2,chY+58); }
  // 能力雷達圖
  const abY=chY+chH+14, abH=210, rcol=t.rainbow?'#ffd257':t.main;
  roundRectPath(ctx,PAD,abY,W-PAD*2,abH,12); ctx.fillStyle='#13131c'; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle=hexA(t.main,.28); ctx.stroke();
  ctx.textAlign='left'; ctx.fillStyle='#c7c7d2'; font(11,700); ctx.fillText('⚙️ 能力數值',PAD+12,abY+18);
  ctx.textAlign='right'; ctx.fillStyle='#c7c7d2'; font(11,600); ctx.fillText(`OVR ${G.overall} · 潛力 ${G.potential}`,W-PAD-12,abY+18);
  (function(){
    const rn=keyAttrs.length, rcx=W/2, rcy=abY+abH/2+12, R=60;
    const rang=i=>-Math.PI/2+i*2*Math.PI/rn, rpt=(i,r)=>[rcx+Math.cos(rang(i))*r, rcy+Math.sin(rang(i))*r];
    // 格線
    [0.5,1].forEach(f=>{ ctx.beginPath(); keyAttrs.forEach((_,i)=>{ const[x,y]=rpt(i,R*f); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.stroke(); });
    // 軸線
    keyAttrs.forEach((_,i)=>{ const[x,y]=rpt(i,R); ctx.beginPath(); ctx.moveTo(rcx,rcy); ctx.lineTo(x,y); ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=1; ctx.stroke(); });
    // 數值多邊形
    ctx.beginPath(); keyAttrs.forEach(([k],i)=>{ const[x,y]=rpt(i,R*clamp(G.attr[k]||0,0,100)/100); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath();
    ctx.fillStyle=hexA(rcol,.28); ctx.fill(); ctx.strokeStyle=rcol; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
    keyAttrs.forEach(([k],i)=>{ const[x,y]=rpt(i,R*clamp(G.attr[k]||0,0,100)/100); ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fillStyle=rcol; ctx.fill(); });
    // 標籤 + 數值
    keyAttrs.forEach(([k,l],i)=>{ const[lx,ly]=rpt(i,R+17); const a=Math.abs(lx-rcx)<12?'center':lx>rcx?'left':'right'; ctx.textAlign=a;
      ctx.fillStyle='#c7c7d2'; font(10,600); ctx.fillText(l,lx,ly-1);
      ctx.fillStyle=rcol; font(11,800); ctx.fillText(G.attr[k]||0,lx,ly+11); });
  })();
  // 六格數據
  const cells=[['生涯出場',G.careerApps],['生涯進球',G.careerGoals],['生涯助攻',G.careerAssists],['最佳球員',(G.careerMOTM||0)+'次'],['榮譽',G.trophies.length],['財富',moneyStr(G.money)]];
  const gy=abY+abH+10, gw=(W-PAD*2-16)/3, gh=56;
  cells.forEach((c,i)=>{ const cx=PAD+(i%3)*(gw+8), cy=gy+Math.floor(i/3)*(gh+8);
    roundRectPath(ctx,cx,cy,gw,gh,12); ctx.fillStyle='#13131c'; ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle=hexA(t.main,.28); ctx.stroke();
    ctx.fillStyle=(i===1||i===3||i===4)?t.main:'#fff'; const fv=String(c[1]); font(fv.length>=6?14:19,900); ctx.textAlign='center'; ctx.fillText(fv,cx+gw/2,cy+26);
    ctx.fillStyle='#b0b0be'; font(10.5,600); ctx.fillText(c[0],cx+gw/2,cy+45);
  });
  // 特質 + 效力球隊（自動換行）
  let ty=gy+gh*2+8+26;
  const drawWrap=(parts,x,y,maxW,fs,lh)=>{ ctx.textAlign='left'; let cx=x, cy=y; parts.forEach(pt=>{ font(fs,pt.wt||600); ctx.fillStyle=pt.col; for(const ch of pt.t){ const w=ctx.measureText(ch).width; if(cx+w>x+maxW){ cx=x; cy+=lh; } ctx.fillText(ch,cx,cy); cx+=w; } }); return cy; };
  ty=drawWrap([{t:'特質：',col:t.main,wt:800},{t:traits.join('、'),col:'#dadae6',wt:600}],PAD,ty,W-PAD*2,12.5,20)+22;
  ty=drawWrap([{t:'效力球隊：',col:t.main,wt:800},{t:teams,col:'#c7c7d2',wt:600}],PAD,ty,W-PAD*2,12.5,20);
  // 頁尾
  ctx.fillStyle='#9a9aa8'; font(10,600); ctx.textAlign='left'; ctx.fillText(`名氣 ⭐${Math.round(G.fame)} · 粉絲 ${(G.socialFollowers||0).toFixed(0)}萬`,PAD,H-22);
  ctx.textAlign='right'; ctx.fillText('FOOTBALL LIFE 足球生涯',W-PAD,H-22);
  // 下載
  cv.toBlob(b=>{
    const url=URL.createObjectURL(b); const a=document.createElement('a');
    a.href=url; a.download=`戰績卡_${G.name}_OVR${peak}.png`; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },100);
    toast('戰績卡已下載！');
  },'image/png');
}

function statBar(label,v){
  const col = v>=80?"linear-gradient(90deg,#ffdd78,#e0a010)":v>=65?"linear-gradient(90deg,#f5c451,#c98a1a)":v>=45?"linear-gradient(90deg,#54a8ff,#2f6fd0)":"linear-gradient(90deg,#6b6b78,#45454f)";
  return `<div class="stat"><div class="stat-top"><span class="stat-name">${label}</span><span class="stat-val">${v}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${v}%; background:${col};"></div></div></div>`;
}
// 能力雷達圖（載入時由中心向外擴張）
function radarChart(rows,col){
  col=col||'#f5c451';
  const n=rows.length, size=230, cx=size/2, cy=size/2, R=size/2-40;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/n;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{ const pts=rows.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' '); rings+=`<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`; });
  let axes='', labels='';
  rows.forEach(([k,label],i)=>{ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+16); const v=G.attr[k]||0; const anchor=Math.abs(lx-cx)<10?'middle':lx>cx?'start':'end';
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly-1).toFixed(1)}" fill="#c7c7d2" font-size="10" text-anchor="${anchor}">${label}</text><text x="${lx.toFixed(1)}" y="${(ly+11).toFixed(1)}" fill="${col}" font-size="11" font-weight="800" text-anchor="${anchor}">${v}</text>`;
  });
  const vpts=rows.map(([k],i)=>pt(i,R*clamp(G.attr[k]||0,0,100)/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=rows.map(([k],i)=>{ const [x,y]=pt(i,R*clamp(G.attr[k]||0,0,100)/100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${col}"/>`;}).join('');
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" style="width:100%; max-width:260px; display:block; margin:2px auto;">
    ${rings}${axes}
    <g class="radar-shape" style="transform-box:view-box; transform-origin:${cx}px ${cy}px;">
      <polygon points="${vpts}" fill="${hexA(col,.25)}" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </g>
    ${labels}
  </svg>`;
}
function careerRatingAvg(){ return G._careerRatingSum? G._careerRatingSum/G.careerApps : 6.5; }

/* ---------- TRAIN ---------- */
const MAX_TRAIN_ENERGY=6;      // 訓練次數上限（可累積）
const TRAIN_PER_MATCH=3;       // 每出賽一場累積的訓練次數
// 訓練次數是「靠出賽累積」的存量：出賽 +3（上限 6）、季前補滿。休息／跳週不會補 → 無法靠休息刷訓練。
function trainEnergy(){
  if(G.trainEnergy==null) G.trainEnergy=3;
  return G.trainEnergy;
}
function spendTrain(n){ n=n||1; if(trainEnergy()<n){ toast(`訓練次數不足，出賽比賽可累積（每場 +${TRAIN_PER_MATCH}，上限 ${MAX_TRAIN_ENERGY}）。`); return false; } G.trainEnergy-=n; return true; }

function trainingCamp(){
  if(G.injury){ toast("受傷中，無法集訓"); return; }
  if(G.fitness<25){ toast("體能不足，先休息"); return; }
  if(trainEnergy()<2){ toast(`集訓需要 2 次訓練體力（本週剩 ${trainEnergy()}），出賽推進賽程再來。`); return; }
  showEvent({emoji:"🏕️",title:"季外集訓營",text:"高強度集訓能全面提升能力，但非常消耗體能、也有受傷風險。你要怎麼練？",
    choices:[
      {i:"🔥",t:"魔鬼特訓（大幅成長）",fn:()=>{
        if(!spendTrain(2)) return;
        const rows=attrRowsForPos(); let msg=[];
        rows.slice(0,5).forEach(([k])=>{ if(chance(70)){ const g=rand(1,3); const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+g,20,99); if(G.attr[k]>b) msg.push(attrLabel(k)); } });
        G.overall=calcOverall(); G.fitness=clamp(G.fitness-35,0,100);
        if(chance(15)){ applyInjuryData(rollInjuryData()); toast("操過頭受傷了…"); }
        else toast(msg.length?`集訓成長：${msg.slice(0,3).join("、")}`:"完成魔鬼特訓");
      }},
      {i:"🚶",t:"適度訓練（穩健）",fn:()=>{ if(!spendTrain(1)) return; const [k]=pick(attrRowsForPos()); const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+rand(1,2),20,99); G.overall=calcOverall(); G.fitness=clamp(G.fitness-15,0,100); toast(`${attrLabel(k)} +${G.attr[k]-b}`); }}
    ]});
}
function hirePrivateCoach(){
  const cost=250;
  if(G.money<cost){ toast("錢不夠"); return; }
  const rows=attrRowsForPos();
  showEvent({emoji:"🧑‍🏫",title:"聘請私人教練",text:`花 ${moneyStr(cost)} 聘請頂級私人教練，指定強化一項能力。`,
    choices:rows.slice(0,4).map(([k,label])=>({i:"🎯",t:`強化 ${label}（目前 ${G.attr[k]}）`,fn:()=>{ if(G.money<cost) return; if(!spendTrain(1)) return; G.money-=cost; const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+rand(4,7),20,99); G.overall=calcOverall(); logEvent("🧑‍🏫",`私人教練特訓：${label} +${G.attr[k]-b}。`,"log-gold"); toast(`${label} +${G.attr[k]-b}`); }}))
  });
}
function miniInline(name,val){
  const col = val>66?"var(--accent)":val>33?"var(--gold)":"var(--red)";
  return `<div style="text-align:center; background:var(--panel2); border-radius:10px; padding:8px;">
    <div class="muted" style="font-size:10px;">${name}</div><div style="font-weight:800; color:${col};">${val}</div></div>`;
}
function courseBtn(ico,name,cost,attr){
  const can=G.money>=cost && trainEnergy()>0;
  return `<button class="choice" onclick="takeCourse('${attr}',${cost})" ${can?'':'disabled style="opacity:.4;"'}>
    <span class="ci">${ico}</span>${name}<span class="cost">${moneyStr(cost)}</span></button>`;
}
function doTrain(k){
  if(G.injury){ toast("受傷中無法訓練"); return; }
  if(G.fitness<15){ toast("體能太低，先休息！"); return; }
  if(!spendTrain(1)) return;
  G.fitness=clamp(G.fitness-12,0,100);
  const gain = growthAmount(1.8);   // 專注單項 → 加成較高
  const before=G.attr[k];
  G.attr[k]=clamp(G.attr[k]+gain,20,99);
  const real=G.attr[k]-before;
  G.overall=calcOverall();
  G.form=clamp(G.form+2,0,100);
  toast(real>0?`${attrLabel(k)} +${real}（專注訓練）`:`${attrLabel(k)} 已達滿值 99`);
  softRender();
}
function doTrainGeneral(){
  if(G.injury){ toast("受傷中無法訓練"); return; }
  if(G.fitness<20){ toast("體能太低，先休息！"); return; }
  if(!spendTrain(1)) return;
  G.fitness=clamp(G.fitness-18,0,100);
  const rows=trainAttrs();   // 含體力/身體，全面涵蓋
  let msg=[];
  rows.forEach(([k])=>{
    if(chance(55)){ const g=Math.max(1,Math.round(growthAmount()/2)); const b=G.attr[k]; G.attr[k]=clamp(G.attr[k]+g,20,99); if(G.attr[k]>b) msg.push(attrLabel(k)); }
  });
  G.overall=calcOverall();
  toast(msg.length?`成長：${msg.join("、")}`:"訓練完成");
  softRender();
}
function growthAmount(mul){
  mul=mul||1;
  const gap=G.potential-G.overall;
  // 不再因接近潛力而歸零：訓練一律至少 +1（仍受屬性 99 硬上限）
  const ageFactor = G.age<21?1.5: G.age<26?1: G.age<30?0.7:0.5;
  let g = Math.round((rand(1,3))*ageFactor*(gap>15?1.3:gap>5?1:gap>0?0.85:0.7)*mul);
  return clamp(g,1,mul>1?5:4);
}
function trainGain(n){
  const rows=attrRowsForPos(); const [k]=pick(rows);
  G.attr[k]=clamp(G.attr[k]+n,20,99); G.overall=calcOverall();
}
function attrLabel(k){
  const m={pace:"速度",shooting:"射門",passing:"傳球",dribbling:"盤帶",defending:"防守",physical:"體格",diving:"飛撲",handling:"手控",kicking:"開球",positioning:"站位",reflexes:"反應",speed:"速度"};
  return m[k]||k;
}
function takeCourse(attr,cost){
  if(G.money<cost){ toast("錢不夠！"); return; }
  if(!spendTrain(1)) return;
  G.money-=cost;
  const g=rand(2,4);
  const b=G.attr[attr]; G.attr[attr]=clamp(G.attr[attr]+g,20,99);
  G.overall=calcOverall();
  logEvent("🧠",`參加專項課程，${attrLabel(attr)} +${G.attr[attr]-b}。`,"");
  toast(`${attrLabel(attr)} +${G.attr[attr]-b}`);
  softRender();
}
function recover(){
  if(G.fitness>=80){ toast("體能已充足，滿狀態需靠出賽或度假維持"); return; }
  G.fitness=Math.min(80,G.fitness+30);   // 隨時可休息，但休息最多回到 80，避免無限刷到滿
  toast("休息恢復，體能回升（休息上限 80）");
  softRender();
}

function buyBtn(ico,name,cost,key){
  const owned=G.achievements.includes(key);
  const can=G.money>=cost && !owned;
  return `<button class="choice" onclick="buyLux('${key}','${name}',${cost})" ${owned?'disabled style="opacity:.5;"':(can?'':'disabled style="opacity:.4;"')}>
    <span class="ci">${ico}</span>${name} ${owned?'✓已擁有':''}<span class="cost">${moneyStr(cost)}</span></button>`;
}
function buyLux(key,name,cost){
  if(G.money<cost || G.achievements.includes(key)) return;
  G.money-=cost; G.achievements.push(key);
  G.fame=clamp(G.fame+rand(2,5),0,100);
  G.morale=clamp(G.morale+8,0,100);
  logEvent("🛍️",`買了一台/棟 ${name}，名氣與心情提升。`,"log-gold");
  toast(`購入 ${name}！名氣 +`); checkMilestones(); save(); render();
}

function updateInvest(type){
  const v=INVESTMENTS[type]; const r=$("#invRange"); if(!r) return;

  r.style.background=`linear-gradient(90deg,#e0a010 ${pct}%, #33333c ${pct}%)`;
  const maxLoss=Math.round(amt*(1-v.lo)), maxGain=Math.round(amt*(v.hi-1)), tot=(maxLoss+maxGain)||1;
  const l=$("#invLoss"), g=$("#invGain"); if(l) l.style.width=(maxLoss/tot*100).toFixed(1)+'%'; if(g) g.style.width=(maxGain/tot*100).toFixed(1)+'%';
  const lt=$("#invLossT"), gt=$("#invGainT"); if(lt) lt.textContent='↓ 最多賠 '+moneyStr(maxLoss); if(gt) gt.textContent='最多賺 '+moneyStr(maxGain)+' ↑';
  const ba=$("#invBtnAmt"); if(ba) ba.textContent='· '+moneyStr(amt);
}
function setInvest(type,frac){
  const r=$("#invRange"); if(!r) return;

function confirmInvest(type){

function invest(type,amount){
  const v=INVESTMENTS[type]; if(!v) return;
  amount=Math.min(Math.floor(G.money),Math.max(0,Math.round(amount||0)));

  G.money-=amount;
  const win=chance(v.winP);
  const mult = win? rand(100,Math.round(v.hi*100))/100 : rand(Math.round(v.lo*100),95)/100;
  const back=Math.round(amount*mult);
  G.money+=back;
  const diff=back-amount;
  logEvent(diff>=0?"📈":"📉",`投資${v.name} ${moneyStr(amount)}：${diff>=0?'獲利':'虧損'} ${moneyStr(Math.abs(diff))}（×${mult.toFixed(2)}）。`,diff>=0?"log-good":"log-bad");

}

// 同類競品排他：已代言同一類別的品牌，就不能再簽競品（如 Nike 與 Adidas 同為運動用品）
function sponsorConflict(b){
  if(!b||!b.cat) return null;
  const s=G.sponsors.find(x=>{ const bb=SPONSOR_BRANDS.find(y=>y.name===x.name); return bb && bb.cat===b.cat; });

function sponsorPay(b){ return Math.round((b.req+G.fame)*(1+G.socialFollowers/50)*(3+b.req/25)); }
function screenSponsor(){
  const signed=new Set(G.sponsors.map(s=>s.name));

    <div class="card" style="background:linear-gradient(160deg,rgba(245,196,81,.05),rgba(255,255,255,.015));">

      <div class="kv"><span class="k">社群粉絲</span><span class="v">${G.socialFollowers.toFixed(1)} 萬</span></div>

function signBrand(name){
  const b=SPONSOR_BRANDS.find(x=>x.name===name); if(!b) return;
  if(G.sponsors.find(s=>s.name===name)){ toast("已經簽過這個品牌了"); return; }
  const conflict=sponsorConflict(b);
  if(conflict){ toast(`競品衝突：你已代言 ${conflict}（同為${b.cat}），無法同時簽 ${b.name}`); return; }
  if(G.fame<b.req){ toast("名氣不足，先打出名堂"); return; }
  if(G.age<(b.age||0)){ toast(`${b.name} 要求年滿 ${b.age} 歲才願意簽約`); return; }
  const pay=sponsorPay(b);
  G.sponsors.push({ico:b.ico,name:b.name,pay});
  logEvent("🤝",`與 ${b.name} 簽下代言合約 ${moneyStr(pay)}/季。`,"log-gold");
  toast(`${b.name} 代言到手！`);
  checkMilestones(); save(); render();
}
function findSponsor(){
  const brands=SPONSOR_BRANDS;
  const avail=brands.filter(b=>G.fame>=b.req && G.age>=(b.age||0) && !G.sponsors.find(s=>s.name===b.name) && !sponsorConflict(b));
  if(!avail.length){ toast(G.sponsors.length?"名氣不足以吸引新品牌":"名氣太低，先打出名堂"); return; }
  const b=pick(avail);
  const pay=sponsorPay(b);
  showEvent({emoji:b.ico,title:"贊助邀約",text:`${b.name} 對你有興趣，開出 ${moneyStr(pay)}/季 的代言合約！`,
    choices:[

      {i:"🤔",t:"再考慮",fn:()=>{toast("婉拒了邀約");}}
    ]});
}
function negotiateWage(){
  if(G.wageAskedSeason===G.season){ toast("本季已談過加薪，展現實力後下季再來吧"); return; }
  const avg=G.seasonApps? G.seasonRatingSum/G.seasonApps : 6.5;

    choices:[{i:"🗣️",t:"提出加薪要求",fn:()=>{
      G.wageAskedSeason=G.season;   // 每季限一次
      if(G.wage>=cap){ toast("已是隊內頂薪，球隊無法再加"); return; }

      else if(chance(30)){ const inc=Math.round(G.wage*rand(5,15)/100); G.wage=Math.min(cap,G.wage+inc); toast(`小幅加薪 +${moneyStr(inc)}`);}
      else{ G.morale=clamp(G.morale-8,0,100); toast("被拒絕了，表現再好一點吧"); }

function requestTransfer(){
  // 每季分夏/冬兩個轉會窗；同一窗內報價固定，重複點開不會重抽（避免一直洗到豪門）
  const key=`${G.season}-${G.week<19?'A':'B'}`;
  let offers;
  if(G._offerKey===key && G._offerCache){ offers=G._offerCache; }
  else { offers=generateOffers(); G._offerKey=key; G._offerCache=offers; }
  if(!offers.length){
    showEvent({emoji:"📭",title:"暫無報價",text:"目前沒有球隊對你有足夠興趣。提升表現與名氣，或等待轉會窗開啟。",choices:[{i:"👍",t:"知道了",fn:()=>{}}]});
    return;
  }
  const r=$("#root");
  showModalCustom(`
    <div class="emoji">🔄</div>
    <h3>轉會市場</h3>
    <p>有 ${offers.length} 支球隊對你有興趣：</p>
    ${(G.trophies||[]).length?`<div class="muted center" style="font-size:11px; margin:-2px 0 8px; color:var(--gold);">🏆 生涯 ${(G.trophies||[]).length} 座榮譽，大球隊更願意招攬你</div>`:''}
    ${offers.map((o,i)=>`
      <button class="choice" onclick="acceptOffer(${i})">
        <span class="ci">${clubBadge(o.club,28)}</span>
        <div style="flex:1;">
          <div style="font-weight:800;">${o.club.n} <span class="pill" style="font-size:9px;">${TIER_LABEL[o.tier]}</span></div>
          <div class="muted" style="font-size:11px;">${o.club.l} · 週薪 ${moneyStr(o.wage)} · 簽字費 ${moneyStr(o.fee)}</div>
        </div>
      </button>`).join("")}
    <button class="choice" onclick="closeModal()"><span class="ci">❌</span>留在原球隊</button>
  `,offers);
  window._offers=offers;
}
function generateOffers(){
  const offers=[];
  const curIdx=TIER_ORDER.indexOf(G.tier);
  const avg=G.seasonApps? G.seasonRatingSum/G.seasonApps : 6.3;
  // 榮譽越多，越有機率獲得大球隊機會：每座獎盃 +5%（最多 +50%），3 座以上可越級挑戰
  const nTro=(G.trophies||[]).length;
  const troBoost=Math.min(50, nTro*5);
  // determine reachable tiers
  TIER_ORDER.forEach((tier,idx)=>{
    const req=TIER_STR[tier]-8;
    const step=idx-curIdx; // 正：升級 負：降級
    // higher tier needs good form + fame（榮譽可大幅提升機率並解鎖越級）
    let p=0;
    if(step===0) p=70;
    else if(step===1) p= ((G.overall>=req && avg>=6.9 && G.fame>=TIER_STR[tier]-40)?55:15) + troBoost;
    else if(step===2) p= (nTro>=3 && G.overall>=req-4 && avg>=7.1)? Math.round(troBoost*0.7) : 0; // 越兩級：需要榮譽在身
    else if(step<0) p=60; // can always drop down
    p=Math.min(p,88);
    if(chance(p)){
      const pool=shuffle(CLUBS[tier].filter(c=>c.n!==G.club.n));
      const nPick = (idx<=curIdx)? rand(1,3) : 1;   // 同級或降級：多抽幾隊，涵蓋各聯賽
      pool.slice(0,nPick).forEach(club=>{
        const [lo,hi]=TIER_WAGE[tier];
        const wage=rand(lo,hi);
        const fee=Math.round(wage*rand(4,12));
        offers.push({club,tier,wage,fee});
      });
    }
  });
  // dedup clubs, 打散後最多 6 個報價
  const seen=new Set();
  return shuffle(offers.filter(o=>{ if(seen.has(o.club.n))return false; seen.add(o.club.n); return true;})).slice(0,6);
}
function acceptOffer(i){
  const o=window._offers[i];
  closeModal();
  G._offerCache=null; G._offerKey=null;   // 已轉會，清掉本窗報價快取
  G.money+=o.fee;
  const oldClub=G.club.n;
  signClub(o.club,o.tier);
  buildLeague(); genSquad();
  G.morale=clamp(G.morale+12,0,100);
  logEvent("🔄",`從 ${oldClub} 轉會加盟 ${o.club.n}，簽字費入袋 ${moneyStr(o.fee)}！`,"log-gold");
  toast(`歡迎加入 ${o.club.n}！`);
  save(); render();
}

/* ============================================================
   LEAGUE ENGINE · 位置角色 · 紅黃牌 · 隊友 (1,2,3,5,8)
   ============================================================ */
// (5) 位置子角色對進攻/助攻/防守的加成
const ROLE_MOD = {
  GK:{atk:0,ast:0,def:1.2},
  ST:{atk:1.35,ast:0.7,def:0}, LW:{atk:1.1,ast:1.05,def:0.05}, RW:{atk:1.1,ast:1.05,def:0.05},
  CAM:{atk:0.95,ast:1.45,def:0.15}, CM:{atk:0.8,ast:1.1,def:0.45}, CDM:{atk:0.45,ast:0.85,def:0.95},
  CB:{atk:0.3,ast:0.3,def:1.25}, LB:{atk:0.55,ast:0.95,def:0.9}, RB:{atk:0.55,ast:0.95,def:0.9},
};
function roleMod(){
  if(G.subRole && ROLE_MOD[G.subRole]) return ROLE_MOD[G.subRole];
  return {GK:ROLE_MOD.GK, DF:ROLE_MOD.CB, MF:ROLE_MOD.CM, FW:ROLE_MOD.ST}[G.pos] || ROLE_MOD.CM;
}

// (1,2) 聯賽積分榜與賽程
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function mkTeam(club,str,me){ return {n:club.n, club, str:clamp(Math.round(str),40,95), P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0, me:!!me}; }
function clubTier(club){
  for(const t of TIER_ORDER){ if(CLUBS[t] && CLUBS[t].some(c=>c.n===club.n)) return t; }
  return G.tier;
}
function buildLeague(){
  if(!G || !G.club) return;
  const lg=G.league;
  // 真實世界同聯賽的所有球隊
  let real=[];
  TIER_ORDER.forEach(t=>{ if(CLUBS[t]) CLUBS[t].forEach(c=>{ if(c.l===lg && c.n!==G.club.n) real.push(c); }); });
  const seen=new Set([G.club.n]); real=real.filter(c=>{ if(seen.has(c.n))return false; seen.add(c.n); return true; });
  shuffle(real);
  const target=clamp(real.length+1, 12, 20);           // 依實際球隊數，最少 12、最多 20 隊
  const opps=real.slice(0, target-1);
  let s=1; while(opps.length<target-1){ opps.push({n:lg+"勁旅 "+s, l:lg}); s++; }
  const teams=[ mkTeam(G.club, G.overall+rand(-2,4), true) ];
  opps.forEach(c=>{ const ct=clubTier(c); teams.push(mkTeam(c, TIER_STR[ct]+rand(-6,9), false)); });
  const idxs=[]; for(let i=1;i<teams.length;i++) idxs.push(i);
  const fixtures=[]; while(fixtures.length<38){ shuffle(idxs); idxs.forEach(i=>{ if(fixtures.length<38) fixtures.push(i); }); }
  G.lg={teams, fixtures};
}
function ensureLeague(){ if(G && G.club && !G.lg) buildLeague(); }
function leagueOpponent(wkIdx){
  ensureLeague(); const lg=G.lg; if(!lg||!lg.fixtures) return null;
  const wk=clamp(wkIdx,0,lg.fixtures.length-1);
  return lg.teams[lg.fixtures[wk]] || null;
}
function applyResult(t,gf,ga){ t.P++; t.GF+=gf; t.GA+=ga; if(gf>ga){t.W++;t.pts+=3;} else if(gf===ga){t.D++;t.pts++;} else t.L++; }
function simPair(a,b){ const d=(a.str-b.str)+rand(-14,14); let ga,gb; if(d>8){ga=rand(1,3);gb=rand(0,1);} else if(d>-8){ga=rand(0,2);gb=rand(0,2);} else {ga=rand(0,1);gb=rand(1,3);} applyResult(a,ga,gb); applyResult(b,gb,ga); }
function recordLeagueResult(o){
  const lg=G.lg; if(!lg) return;
  const me=lg.teams.find(t=>t.me); if(!me) return;
  applyResult(me,o.myGoals,o.oppGoals);
  if(o.opp) applyResult(o.opp,o.oppGoals,o.myGoals);
  const rest=shuffle(lg.teams.filter(t=>!t.me && t!==o.opp));
  for(let i=0;i+1<rest.length;i+=2) simPair(rest[i],rest[i+1]);
}
function standings(){ return [...(G.lg?G.lg.teams:[])].sort((x,y)=> y.pts-x.pts || (y.GF-y.GA)-(x.GF-x.GA) || y.GF-x.GF); }
function myRank(){ const s=standings(); const i=s.findIndex(t=>t.me); return i<0?0:i+1; }

// (8) 隊友陣容
const MATE_NAMES=["Rodri","Vinícius","Kane","Musiala","Bruno","Pedri","Rúben","佐藤","Odegaard","Saka","Bellingham","Foden","Yamal","Wirtz","金玟哉","Rafael","Osimhen","Lautaro"];
function genSquad(){
  const abs=["GK","CB","CB","LB","RB","CDM","CM","CAM","LW","ST","RW"].filter(a=>a!==G.subRole);
  const n=rand(4,6); const used=new Set([G.name]); const sq=[];
  for(let i=0;i<n;i++){
    let nm=pick(MATE_NAMES); let g=0; while(used.has(nm)&&g++<20) nm=pick(MATE_NAMES); used.add(nm);
    sq.push({name:nm, ab:pick(abs), rating:clamp(TIER_STR[G.tier]+rand(-6,8),45,92)});
  }
  sq.sort((a,b)=>b.rating-a.rating);
  G.squad=sq; if(G.chem==null) G.chem=rand(55,70);
}
function ensureSquad(){ if(G && G.club && !G.squad) genSquad(); }

// (7) 市場身價估算
function marketValue(){
  let v = Math.pow(Math.max(0,G.overall-40),2)*0.9;      // 能力主導
  const ageF = G.age<=21?1.5: G.age<=26?1.3: G.age<=29?1: G.age<=32?0.55:0.25;
  v *= ageF;
  v *= (1 + (G.potential-G.overall)/60);                  // 潛力溢價
  v *= (1 + G.fame/140);                                   // 名氣
  v *= (0.9 + G.form/300);
  return Math.max(50, Math.round(v));                     // 千歐
}

// 跳過整季：自動模擬剩餘比賽
function skipSeason(){

    }

  }
